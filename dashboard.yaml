      /*
       * ==========================================================
       * PV TOTAL
       * ==========================================================
       */

      .pv-total-panel {
        display: grid;
        grid-template-columns: 65px 1fr auto;
        align-items: center;
        height: 145px;
        padding: 18px 24px;

        background:
          radial-gradient(
            circle at 85% 120%,
            rgba(255,193,7,0.26),
