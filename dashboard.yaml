      /*
       * ==========================================================
       * V7 – DYNAMISCHE MPPT-TRACKER
       * ==========================================================
       */

      .solar-dashboard {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;

        grid-template-areas:
          "mppt mppt"
          "pv battery"
          "live live"
          "payment runtime" !important;
      }

      .mppt-grid {
        grid-area: mppt;
