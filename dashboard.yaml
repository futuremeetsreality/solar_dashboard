      /*
       * ==========================================================
       * V5 – QUERBALKEN PV TOTAL / BATTERIE
       * ==========================================================
       */

      .v5-bar-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 0;
        padding: 10px 12px;
      }

      .pv-total-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 20% 120%,
            rgba(255,152,0,0.14),
            transparent 48%
          ),
          radial-gradient(
            circle at 85% 120%,
            rgba(67,160,71,0.14),
            transparent 48%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .battery-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 50% 120%,
            rgba(118,255,122,0.10),
            transparent 52%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .v5-bar-header {
        display: flex;
        min-width: 0;
      }

      .centered-header {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .v5-bar-title {
        color: var(--solar-text-secondary);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.8px;
        line-height: 1;
      }

      .v5-bar-main {
        margin-top: 2px;
        color: var(--solar-text);
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .v5-bar-main span {
        font-size: 8px;
        opacity: 0.7;
      }

      .v5-bar-percent {
        font-size: 15px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .pv-percent {
        color: #ffd740;
      }

      .pv-split-track,
      .battery-horizontal-track {
        position: relative;
        display: flex;
        width: 100%;
        height: 12px;
        overflow: hidden;
        border: 1px solid var(--solar-divider);
        border-radius: 999px;
        background: var(--solar-track);
        box-shadow:
          inset 0 1px 3px rgba(0,0,0,0.22);
      }

      .pv-segment {
        height: 100%;
        transition: width 0.7s ease;
      }

      .mppt1-segment {
        background:
          linear-gradient(
            90deg,
            #ff9800,
            #ffd740
          );
        box-shadow:
          0 0 9px rgba(255,152,0,0.55);
      }

      .mppt2-segment {
        background:
          linear-gradient(
            90deg,
            #43a047,
            #76ff7a
          );
        box-shadow:
          0 0 9px rgba(118,255,122,0.45);
      }

      .battery-horizontal-fill {
        height: 100%;
        border-radius: 999px;
        transition:
          width 0.7s ease,
          background 0.3s ease;
      }

      .v5-bar-footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 4px;
        width: 100%;
        min-width: 0;
        color: var(--solar-text-secondary);
        font-size: 6.5px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
      }

      .v5-bar-footer > span:first-child {
        justify-self: start;
      }

      .v5-footer-center {
        justify-self: center;
        text-align: center;
      }

      .v5-bar-footer > span:last-child {
        justify-self: end;
        text-align: right;
      }

      .mppt1-footer {
        color: #ffb52e;
      }

      .mppt2-footer {
        color: #76ff7a;
      }

      @media screen and (max-width: 699px) {

