          margin-top: 4px;
        }

        /* Zeile 5 – Vergütung und Restlaufzeit */

        .information-panel {
          grid-template-columns: 31px 1fr;
          padding: 6px 8px;
        }

        .information-panel ha-icon {
          width: 23px;
          height: 23px;
        }

        .information-title {
          font-size: 8px;
        }

        .information-value {
          margin-top: 1px;
          font-size: 16px;
        }

        .information-subtitle {
          margin-top: 1px;
          font-size: 6.5px;
        }
      }

      /*
       * ==========================================================
       * V3 KOMPAKT – QUERFORMAT / DESKTOP
       * ==========================================================
       */

      @media screen and (min-width: 700px) {

        .mppt-panel,
        .live-panel {
          height: 166px;
        }

        .pv-total-panel,
        .battery-panel,
        .information-panel {
          height: 96px;
        }

        .pv-total-panel,
        .battery-panel {
          padding-top: 9px;
          padding-bottom: 9px;
        }
      }


      /*
       * ==========================================================
       * V4 – PV TOTAL UND BATTERIE IN EINER ZEILE
       * ==========================================================
       */

      @media screen and (max-width: 699px) {

        .pv-total-panel,
        .battery-panel {
          height: 82px;
          min-width: 0;
          padding: 6px 7px;
        }

        .pv-total-panel {
          grid-template-columns: 24px minmax(0, 1fr);
          grid-template-areas:
            "icon main"
            "daily daily";
          column-gap: 5px;
          row-gap: 1px;
        }

        .pv-total-icon {
          grid-area: icon;
          align-self: center;
        }

        .pv-total-main {
          grid-area: main;
          min-width: 0;
        }

        .pv-total-daily {
          grid-area: daily;
          padding-left: 0;
          text-align: left;
        }

        .pv-total-icon ha-icon {
          width: 20px;
          height: 20px;
        }

        .section-label {
          font-size: 6.5px;
        }

        .pv-total-power {
          margin-top: 0;
          font-size: 16px;
        }

        .pv-total-power span {
          font-size: 7px;
        }

        .pv-total-status {
          display: none;
        }

        .pv-total-daily .small-label {
          display: none;
        }

        .pv-total-daily-value {
          margin-top: 0;
          font-size: 8px;
          opacity: 0.7;
        }

        .battery-panel {
          grid-template-columns: 25px minmax(0, 1fr);
          grid-template-areas:
            "symbol main"
            "details details";
          column-gap: 5px;
          row-gap: 1px;
        }

        .battery-symbol {
          grid-area: symbol;
          width: 20px;
          height: 40px;
          align-self: center;
        }

        .battery-main {
          grid-area: main;
          min-width: 0;
        }

        .battery-details {
          grid-area: details;
          display: grid;
          grid-template-columns: auto auto auto auto;
          align-items: center;
          gap: 3px;
          padding-left: 0;
          text-align: left;
        }

        .battery-tip {
          top: -3px;
          left: 6px;
          width: 8px;
          height: 4px;
        }

        .battery-body {
          border-width: 2px;
          border-radius: 5px;
        }

        .battery-soc {
          margin-top: 0;
          font-size: 17px;
        }

        .battery-soc span {
          font-size: 8px;
        }

        .battery-status {
          margin-top: 1px;
          font-size: 6px;
        }

        .battery-details .small-label {
          font-size: 5.5px;
          letter-spacing: 0;
        }

        .battery-detail-value {
          margin-top: 0;
          font-size: 7px;
        }

        .battery-detail-gap {
          margin-top: 0;
        }
      }


      /*
       * ==========================================================
       * V5 – QUERBALKEN PV TOTAL / BATTERIE
       * ==========================================================
       */

      .v5-bar-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 0;
        padding: 10px 12px;
      }

      .pv-total-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 20% 120%,
            rgba(255,152,0,0.14),
            transparent 48%
          ),
          radial-gradient(
            circle at 85% 120%,
            rgba(67,160,71,0.14),
            transparent 48%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .battery-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 50% 120%,
            rgba(118,255,122,0.10),
            transparent 52%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .v5-bar-header {
        display: flex;
        min-width: 0;
      }

      .centered-header {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .v5-bar-title {
        color: var(--solar-text-secondary);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.8px;
        line-height: 1;
      }

      .v5-bar-main {
        margin-top: 2px;
        color: var(--solar-text);
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .v5-bar-main span {
        font-size: 8px;
        opacity: 0.7;
      }

      .v5-bar-percent {
        font-size: 15px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .pv-percent {
        color: #ffd740;
      }

      .pv-split-track,
      .battery-horizontal-track {
        position: relative;
        display: flex;
        width: 100%;
        height: 12px;
        overflow: hidden;
        border: 1px solid var(--solar-divider);
        border-radius: 999px;
        background: var(--solar-track);
        box-shadow:
          inset 0 1px 3px rgba(0,0,0,0.22);
      }

      .pv-segment {
        height: 100%;
        transition: width 0.7s ease;
      }

      .mppt1-segment {
        background:
          linear-gradient(
            90deg,
            #ff9800,
            #ffd740
          );
        box-shadow:
          0 0 9px rgba(255,152,0,0.55);
      }

      .mppt2-segment {
        background:
          linear-gradient(
            90deg,
            #43a047,
            #76ff7a
          );
        box-shadow:
          0 0 9px rgba(118,255,122,0.45);
      }

      .battery-horizontal-fill {
        height: 100%;
        border-radius: 999px;
        transition:
          width 0.7s ease,
          background 0.3s ease;
      }

      .v5-bar-footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 4px;
        width: 100%;
        min-width: 0;
        color: var(--solar-text-secondary);
        font-size: 6.5px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
      }

      .v5-bar-footer > span:first-child {
        justify-self: start;
      }

      .v5-footer-center {
        justify-self: center;
        text-align: center;
      }

      .v5-bar-footer > span:last-child {
        justify-self: end;
        text-align: right;
      }

      .mppt1-footer {
        color: #ffb52e;
      }

      .mppt2-footer {
        color: #76ff7a;
      }

      @media screen and (max-width: 699px) {

        .pv-total-panel.v5-bar-panel,
        .battery-panel.v5-bar-panel {
          height: 82px;
          padding: 8px 9px;
          gap: 5px;
        }

        .v5-bar-title {
          font-size: 7px;
        }

        .v5-bar-main {
          font-size: 16px;
        }

        .v5-bar-percent {
          font-size: 13px;
        }

        .pv-split-track,
        .battery-horizontal-track {
          height: 10px;
        }

        .v5-bar-footer {
          font-size: 5.8px;
        }
      }

      @media screen and (min-width: 700px) {

        .pv-total-panel.v5-bar-panel,
        .battery-panel.v5-bar-panel {
          height: 96px;
          padding: 12px 16px;
        }

        .v5-bar-title {
          font-size: 9px;
        }

        .v5-bar-main {
          font-size: 23px;
        }

        .v5-bar-percent {
          font-size: 18px;
        }

        .pv-split-track,
        .battery-horizontal-track {
          height: 14px;
        }

        .v5-bar-footer {
          font-size: 8px;
        }
      }


      /*
       * ==========================================================
       * V7 – DYNAMISCHE MPPT-TRACKER
       * ==========================================================
       */

      .solar-dashboard {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;

        grid-template-areas:
          "mppt mppt"
          "pv battery"
          "live live"
          "payment runtime" !important;
      }

      .mppt-grid {
        grid-area: mppt;
        display: grid;
        grid-template-columns:
          repeat(
            auto-fit,
            minmax(min(145px, 100%), 1fr)
          );
        gap: 7px;
        min-width: 0;
      }

      .mppt-grid .mppt-panel {
        min-width: 0;
      }

      .mppt-grid .mppt-daily-box ha-icon {
        color: var(--tracker-end);
        filter:
          drop-shadow(
            0 0 6px var(--tracker-start)
          );
      }

      .v7-pv-footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 5px;
        width: 100%;
        min-width: 0;
        color: var(--solar-text-secondary);
        font-size: 5.8px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
      }

      .tracker-footer-values {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }

      .tracker-footer-values span {
        flex: 0 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .v7-pv-footer .pv-percent {
        justify-self: end;
        text-align: right;
      }

      @media screen and (max-width: 699px) {

        .mppt-grid {
          grid-template-columns:
            repeat(
              auto-fit,
              minmax(min(145px, 100%), 1fr)
            );
          gap: 6px;
        }

        .mppt-grid .mppt-panel {
          height: 174px;
        }

        .v7-pv-footer {
          font-size: 5.2px;
          gap: 3px;
        }

        .tracker-footer-values {
          gap: 2px;
        }
      }

      @media screen and (min-width: 700px) {

        .solar-dashboard {
          grid-template-columns:
            repeat(2, minmax(0, 1fr)) !important;

          grid-template-areas:
            "mppt mppt"
            "pv battery"
            "live live"
            "payment runtime" !important;
        }

        .mppt-grid {
          grid-template-columns:
            repeat(
              var(--mppt-count),
              minmax(0, 1fr)
            );
          gap: 10px;
        }

        .mppt-grid .mppt-panel {
          height: 180px;
        }

        .v7-pv-footer {
          font-size: 7px;
        }
      }

      /* V7.2 ADAPTIVE THEME MANAGER */
      /*
       * Die Oberflächen basieren auf den aktiven Home-Assistant-Themefarben.
       * Dadurch funktioniert derselbe Code in Hell- und Dunkelmodus sowie
       * mit benutzerdefinierten HA-Themes. Farbakzente werden mit der
       * aktuellen Text-/Kartenfarbe gemischt, damit der Kontrast erhalten bleibt.
       */

      .solar-dashboard {
        --solar-pv: color-mix(in srgb, #ffb300 82%, var(--solar-text) 18%);
        --solar-house: color-mix(in srgb, #42a5f5 82%, var(--solar-text) 18%);
        --solar-grid: color-mix(in srgb, #00b8d4 82%, var(--solar-text) 18%);
        --solar-battery: color-mix(in srgb, #43a047 82%, var(--solar-text) 18%);
        --solar-payment: color-mix(in srgb, #42a5f5 78%, var(--solar-text) 22%);
        --solar-runtime: color-mix(in srgb, #8e5cff 78%, var(--solar-text) 22%);

        --solar-glow-pv: color-mix(in srgb, #ffb300 15%, transparent);
        --solar-glow-house: color-mix(in srgb, #42a5f5 11%, transparent);
        --solar-glow-grid: color-mix(in srgb, #00b8d4 10%, transparent);
        --solar-glow-battery: color-mix(in srgb, #43a047 13%, transparent);
        --solar-glow-payment: color-mix(in srgb, #42a5f5 12%, transparent);
        --solar-glow-runtime: color-mix(in srgb, #8e5cff 12%, transparent);

        --solar-glass-top:
          color-mix(in srgb, var(--solar-surface) 96%, var(--solar-text) 4%);
        --solar-glass-bottom:
          color-mix(in srgb, var(--solar-surface) 99%, var(--solar-text) 1%);

        --solar-track:
          color-mix(in srgb, var(--solar-text) 9%, transparent);
        --solar-inset:
          color-mix(in srgb, var(--solar-text) 5%, transparent);
        --solar-gauge-track:
          color-mix(in srgb, var(--solar-text) 14%, transparent);
        --solar-border:
          color-mix(in srgb, var(--solar-text) 13%, transparent);
        --solar-divider:
          color-mix(in srgb, var(--solar-text) 15%, transparent);

        --solar-shadow:
          0 7px 22px rgba(0, 0, 0, 0.13);
      }

      .panel {
        background:
          linear-gradient(
            145deg,
            var(--solar-glass-top),
            var(--solar-glass-bottom)
          );
        border-color: var(--solar-border);
        box-shadow: var(--solar-shadow);
      }

      /* MPPT: jeder Tracker erhält einen Glow aus seinen eigenen Farben. */
      .mppt-panel {
        background:
          radial-gradient(
            circle at 12% 115%,
            color-mix(in srgb, var(--tracker-start) 14%, transparent),
            transparent 48%
          ),
          radial-gradient(
            circle at 92% -10%,
            color-mix(in srgb, var(--tracker-end) 8%, transparent),
            transparent 46%
          ),
          linear-gradient(
            145deg,
            var(--solar-glass-top),
            var(--solar-glass-bottom)
          );
      }

      .mppt-daily-box {
        background:
          linear-gradient(
            145deg,
            color-mix(in srgb, var(--solar-inset) 86%, var(--tracker-end) 14%),
            var(--solar-inset)
          );
        border-color:
          color-mix(in srgb, var(--solar-border) 78%, var(--tracker-start) 22%);
      }

      /* Live-Leiste: dezente Farbzonen für PV / Haus / Netz / Batterie. */
      .live-panel {
        background:
          radial-gradient(circle at 10% 115%, var(--solar-glow-pv), transparent 34%),
          radial-gradient(circle at 38% 115%, var(--solar-glow-house), transparent 34%),
          radial-gradient(circle at 66% 115%, var(--solar-glow-grid), transparent 34%),
          radial-gradient(circle at 92% 115%, var(--solar-glow-battery), transparent 34%),
          linear-gradient(145deg, var(--solar-glass-top), var(--solar-glass-bottom));
      }

      .live-pv ha-icon,
      .live-pv .live-current {
        color: var(--solar-pv);
      }

      .live-house ha-icon,
      .live-house .live-current {
        color: var(--solar-house);
      }

      .live-grid-value ha-icon,
      .live-grid-value .live-current {
        color: var(--solar-grid);
      }

      .live-battery ha-icon,
      .live-battery .live-current {
        color: var(--solar-battery);
      }

      /* PV Total: stärkerer Orange-/Grün-Verlauf, aber weiterhin Theme-basiert. */
      .pv-total-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 10% 115%,
            color-mix(in srgb, #ff9800 18%, transparent),
            transparent 46%
          ),
          radial-gradient(
            circle at 92% 115%,
            color-mix(in srgb, #43a047 16%, transparent),
            transparent 46%
          ),
          radial-gradient(
            circle at 52% -25%,
            color-mix(in srgb, #64b5f6 6%, transparent),
            transparent 52%
          ),
          linear-gradient(
            145deg,
            var(--solar-glass-top),
            var(--solar-glass-bottom)
          );
      }

      .pv-percent {
        color: var(--solar-pv) !important;
      }

      .tracker-footer-values span {
        color:
          color-mix(
            in srgb,
            var(--tracker-end) 76%,
            var(--solar-text) 24%
          ) !important;
        text-shadow:
          0 0 7px color-mix(in srgb, var(--tracker-start) 18%, transparent);
      }

      .pv-split-track,
      .battery-horizontal-track {
        background:
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--solar-track) 88%, var(--solar-text) 12%),
            var(--solar-track)
          );
        border-color: var(--solar-border);
      }

      /* Batterie: Grün plus warmer Lade-/Entlade-Akzent. */
      .battery-panel.v5-bar-panel {
        background:
          radial-gradient(
            circle at 10% 115%,
            color-mix(in srgb, #43a047 15%, transparent),
            transparent 48%
          ),
          radial-gradient(
            circle at 92% 115%,
            color-mix(in srgb, #ffb300 8%, transparent),
            transparent 48%
          ),
          linear-gradient(
            145deg,
            var(--solar-glass-top),
            var(--solar-glass-bottom)
          );
      }

      /* Vergütung und Restlaufzeit erhalten eigene dezente Glows. */
      .payment-panel {
        background:
          radial-gradient(circle at 8% 110%, var(--solar-glow-payment), transparent 48%),
          radial-gradient(circle at 94% -20%, color-mix(in srgb, #26c6da 6%, transparent), transparent 44%),
          linear-gradient(145deg, var(--solar-glass-top), var(--solar-glass-bottom));
      }

      .runtime-panel {
        background:
          radial-gradient(circle at 10% 110%, var(--solar-glow-runtime), transparent 48%),
          radial-gradient(circle at 94% -20%, color-mix(in srgb, #b388ff 7%, transparent), transparent 44%),
          linear-gradient(145deg, var(--solar-glass-top), var(--solar-glass-bottom));
      }

      .payment-panel ha-icon,
      .payment-panel .information-title {
        color: var(--solar-payment);
      }

      .runtime-panel ha-icon,
      .runtime-panel .information-title {
        color: var(--solar-runtime);
      }

      /* Kleine Texte erhalten etwas mehr Kontrast, besonders im Hellmodus. */
      .v5-bar-footer,
      .v7-pv-footer,
      .live-double-value,
      .information-subtitle,
      .small-label {
        color:
          color-mix(
            in srgb,
            var(--solar-text-secondary) 86%,
            var(--solar-text) 14%
          );
      }

