# solar_dashboard V7.1 - dashboard.yaml
# Aktualisiert: 2026-08-07 21:25
# Voraussetzungen: custom:button-card, custom:power-flux-card, card-mod

type: vertical-stack
cards:
  - type: custom:power-flux-card
    zoom: 0.62
    compact_view: true
    compact_glow: false
    compact_bar_selfuse: false
    compact_icons_in_bracket: true
    horizontal_view: false
    diamond_view: true
    use_boxes: false
    compact_details: true

    consumer_1_unit_kw: false
    consumer_2_unit_kw: false
    consumer_3_unit_kw: false
    show_consumer_always: false

    consumer_1_hide_pipe: false
    consumer_1_pipe_threshold: 0
    consumer_2_hide_pipe: false
    consumer_2_pipe_threshold: 0
    consumer_3_hide_pipe: false
    consumer_3_pipe_threshold: 0
    consumer_4_hide_pipe: false
    consumer_4_pipe_threshold: 0
    consumer_5_hide_pipe: false
    consumer_5_pipe_threshold: 0

    show_donut_border: false
    show_neon_glow: true
    show_comet_tail: true
    show_dashed_line: false
    show_tinted_background: true
    hide_inactive_flows: true

    show_flow_rate_solar: true
    show_flow_rate_grid: true
    show_flow_rate_battery: true

    show_label_solar: true
    show_label_grid: false
    show_label_battery: false
    show_label_house: false

    use_colored_values: true
    hide_consumer_icons: false

    entities:
      solar: sensor.solax_inverter_pv_power_total
      grid: sensor.solax_inverter_grid_import
      grid_export: sensor.solax_inverter_grid_export
      grid_combined: ""
      battery: sensor.solax_inverter_battery_1_power_charge
      battery_soc: sensor.solax_inverter_battery_1_capacity
      battery_charge: ""
      battery_discharge: ""
      house: sensor.solax_inverter_house_load
      consumer_1: ""
      consumer_2: ""
      consumer_3: ""
      consumer_4: ""
      secondary_grid: sensor.solax_inverter_today_s_export_energy
      secondary_solar: sensor.solax_inverter_today_s_solar_energy
      secondary_house: sensor.technikraum_solax_inverter_hausverbrauch_heute
      tertiary_house: sensor.solax_inverter_today_s_import_energy
      secondary_battery: sensor.solax_inverter_battery_input_energy_today
      grid_to_battery: sensor.technikraum_solax_energy_dashboard_solax_grid_to_battery_power

    solar_icon: mdi:weather-sunny
    grid_icon: mdi:transmission-tower
    battery_icon: mdi:battery-outline

    color_solar: "#ffd740"
    color_pipe_solar: "#ffd740"
    color_text_solar: "#ffd740"
    color_icon_solar: "#ffd740"

    color_export: "#26c6da"
    color_pipe_export: "#26c6da"
    color_text_export: "#26c6da"
    color_icon_export: "#26c6da"

    color_grid: "#ff9800"
    color_pipe_grid: "#ff9800"
    color_text_grid: "#ff9800"
    color_icon_grid: "#ff9800"

    color_battery: "#76ff7a"
    color_pipe_battery: "#76ff7a"
    color_text_battery: "#76ff7a"
    color_icon_battery: "#76ff7a"

    color_house: "#64b5f6"
    color_text_house: "#64b5f6"
    color_icon_house: "#64b5f6"

    battery_show_power: true
    battery_charge_via_house: false

    grid_options:
      columns: full

    card_mod:
      style: |
        ha-card {
          background: var(--ha-card-background, var(--card-background-color)) !important;
          border: 1px solid var(--divider-color, rgba(127,127,127,0.22)) !important;
          border-radius: 24px !important;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16) !important;
          color: var(--primary-text-color) !important;
          overflow: hidden !important;
        }

        ha-card * {
          font-family: var(--primary-font-family);
        }

        @media screen and (max-width: 699px) {
          ha-card {
            border-radius: 19px !important;
          }
        }

  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update: all
    custom_fields:
      dashboard: |
        [[[

          /*
           * ========================================================
           * BENUTZERKONFIGURATION – NUR DIESEN BLOCK ANPASSEN
           * ========================================================
           *
           * Alle Entity-IDs dürfen aus beliebigen Integrationen stammen.
           * Entscheidend ist nur, dass sie den beschriebenen Messwert liefern.
           *
           * Hinweise:
           * - Leistung: W oder kW wird automatisch erkannt.
           * - Energie: Wh oder kWh wird automatisch erkannt.
           * - Optionale Sensoren dürfen als leerer String "" gesetzt werden.
           */

          const CONFIG = {

            /*
             * ======================================================
             * MPPT / TRACKER
             * ======================================================
             *
             * Beliebig viele Tracker möglich.
             *
             * 1 Tracker:
             *   Nur einen Block in dieser Liste stehen lassen.
             *
             * 3 Tracker:
             *   Einen dritten Block hinzufügen.
             *
             * Das Dashboard erzeugt die MPPT-Karten, Farben,
             * Maximalwerte und den geteilten PV-Balken automatisch.
             *
             * Pflicht pro Tracker:
             * - name        = Anzeigename
             * - power       = aktuelle Leistung, W oder kW
             * - energyToday = Tagesertrag, Wh oder kWh
             * - maxKw       = maximale Generatorleistung dieses Trackers in kW
             *
             * Farben sind frei wählbar.
             */

            trackers: [
              {
                // Tracker 1 / String 1
                name: 'MPPT 1',

                // [PFLICHT] Aktuelle Leistung dieses PV-Trackers.
                // Messwert: momentane elektrische Leistung.
                // Einheit: W oder kW.
                power:
                  'sensor.solax_inverter_pv_power_1',

                // [PFLICHT] Heute erzeugte Energie dieses Trackers.
                // Messwert: seit Mitternacht aufsummierter PV-Ertrag.
                // Einheit: Wh oder kWh.
                energyToday:
                  'sensor.technikraum_solax_inverter_mppt_1_tageszahler',

                // Maximale/zugeordnete Generatorleistung dieses Trackers.
                // Einheit: kW.
                maxKw: 9.10,

                // Farbe des Halbkreis-Gauges und PV-Segments.
                colorStart: '#ff9800',
                colorEnd: '#ffd740'
              },

              {
                // Tracker 2 / String 2
                name: 'MPPT 2',

                // [PFLICHT] Aktuelle Leistung dieses PV-Trackers.
                // Einheit: W oder kW.
                power:
                  'sensor.solax_inverter_pv_power_2',

                // [PFLICHT] Heute erzeugte Energie dieses Trackers.
                // Einheit: Wh oder kWh.
                energyToday:
                  'sensor.technikraum_solax_inverter_mppt_2_tageszahler',

                // Maximale/zugeordnete Generatorleistung dieses Trackers.
                // Einheit: kW.
                maxKw: 6.37,

                colorStart: '#43a047',
                colorEnd: '#76ff7a'
              }

              /*
               * Beispiel MPPT 3:
               *
               * ,{
               *   name: 'MPPT 3',
               *   power: 'sensor.mein_mppt_3_power',
               *   energyToday: 'sensor.mein_mppt_3_energy_today',
               *   maxKw: 5.00,
               *   colorStart: '#2196f3',
               *   colorEnd: '#00e5ff'
               * }
               */
            ],

            entities: {

              /*
               * PV GESAMT
               */

              // [PFLICHT] Aktuelle gesamte PV-Leistung.
              // Messwert: Summe aller aktuell erzeugenden PV-Eingänge.
              // Einheit: W oder kW.
              pvPowerTotal:
                'sensor.solax_inverter_pv_power_total',

              // [PFLICHT] Gesamte heute erzeugte PV-Energie.
              // Messwert: aufsummierte Solarproduktion seit Mitternacht.
              // Einheit: Wh oder kWh.
              pvEnergyToday:
                'sensor.solax_inverter_today_s_solar_energy',

              /*
               * HAUS
               */

              // [PFLICHT] Aktueller Hausverbrauch.
              // Messwert: momentane gesamte Verbraucherleistung des Hauses.
              // Einheit: W oder kW.
              housePower:
                'sensor.solax_inverter_house_load',

              // [OPTIONAL] Hausverbrauch seit Mitternacht.
              // Messwert: aufsummierter Energieverbrauch des Hauses heute.
              // Einheit: Wh oder kWh.
              // Wenn "", wird der Tagesverbrauch aus PV, Netz und Batterie berechnet.
              houseEnergyToday:
                'sensor.technikraum_solax_inverter_hausverbrauch_heute',

              /*
               * NETZ
               */

              // [PFLICHT] Aktueller Netzbezug.
              // Messwert: Leistung, die momentan AUS dem Stromnetz bezogen wird.
              // Einheit: W oder kW. Idealerweise positiver Wert.
              gridImportPower:
                'sensor.solax_inverter_grid_import',

              // [PFLICHT] Aktuelle Netzeinspeisung.
              // Messwert: Leistung, die momentan INS Stromnetz eingespeist wird.
              // Einheit: W oder kW. Idealerweise positiver Wert.
              gridExportPower:
                'sensor.solax_inverter_grid_export',

              // [PFLICHT] Heute aus dem Netz bezogene Energie.
              // Messwert: Netzimport seit Mitternacht.
              // Einheit: Wh oder kWh.
              gridImportEnergyToday:
                'sensor.solax_inverter_today_s_import_energy',

              // [PFLICHT] Heute ins Netz eingespeiste Energie.
              // Messwert: Netzeinspeisung seit Mitternacht.
              // Einheit: Wh oder kWh.
              gridExportEnergyToday:
                'sensor.solax_inverter_today_s_export_energy',

              /*
               * BATTERIE
               */

              // [PFLICHT] Ladezustand der Batterie.
              // Messwert: State of Charge.
              // Einheit: %.
              batterySoc:
                'sensor.solax_inverter_battery_1_capacity',

              // [PFLICHT] Aktuelle Batterieleistung.
              // Messwert: momentane Lade-/Entladeleistung.
              // Einheit: W oder kW.
              // Dashboard-Logik: positiv = Laden, negativ = Entladen.
              batteryPower:
                'sensor.solax_inverter_battery_1_power_charge',

              // [PFLICHT] Aktuell noch gespeicherte/verfügbare Batterieenergie.
              // Einheit: Wh oder kWh.
              batteryEnergyRemaining:
                'sensor.solax_inverter_remaining_battery_energy',

              // [PFLICHT] Heute in die Batterie geladene Energie.
              // Einheit: Wh oder kWh.
              batteryChargeEnergyToday:
                'sensor.solax_inverter_battery_input_energy_today',

              // [PFLICHT] Heute aus der Batterie entladene Energie.
              // Einheit: Wh oder kWh.
              batteryDischargeEnergyToday:
                'sensor.solax_inverter_battery_output_energy_today',

              /*
               * OPTIONALE ZUSATZWERTE
               */

              // [OPTIONAL] Heutige Einspeisevergütung / Erlös.
              // Einheit: EUR.
              compensationToday:
                'sensor.ugendorf_electricity_costs_tages_einspeisung',

              // [OPTIONAL] Geschätzte Restlaufzeit der Batterie.
              batteryRuntime:
                'sensor.ugendorf_battery_restlaufzeit'
            },

            limits: {
              // Batteriekapazität in kWh.
              batteryCapacityKwh: 12.50
            }
          };

          /*
           * ========================================================
           * HILFSFUNKTIONEN
           * ========================================================
           */

          function getSensor(entityId) {
            return states[entityId];
          }

          function getNumber(entityId, fallback = 0) {
            const sensor = getSensor(entityId);
            const value = Number.parseFloat(sensor?.state);

            return Number.isFinite(value) ? value : fallback;
          }

          function getPower(entityId) {
            const sensor = getSensor(entityId);
            let value = Number.parseFloat(sensor?.state);

            if (!Number.isFinite(value)) {
              return 0;
            }

            const unit =
              sensor?.attributes?.unit_of_measurement || '';

            if (unit === 'W') {
              value = value / 1000;
            }

            return value;
          }

          function getEnergy(entityId) {
            const sensor = getSensor(entityId);
            let value = Number.parseFloat(sensor?.state);

            if (!Number.isFinite(value)) {
              return 0;
            }

            const unit =
              sensor?.attributes?.unit_of_measurement || '';

            if (unit === 'Wh') {
              value = value / 1000;
            }

            return value;
          }

          function formatNumber(
            value,
            minimumFractionDigits = 2,
            maximumFractionDigits = 2
          ) {
            return value.toLocaleString('de-AT', {
              minimumFractionDigits,
              maximumFractionDigits
            });
          }

          function formatPower(value) {
            return formatNumber(value, 3, 3);
          }

          function formatEnergy(value) {
            return formatNumber(value, 2, 2);
          }

          function createGauge(
            value,
            maximum,
            gradientId,
            glowId,
            color
          ) {
            const percentage =
              Math.min(Math.max(value / maximum, 0), 1);

            const pathLength = 100;
            const visibleLength = percentage * pathLength;
            const remainingLength = pathLength - visibleLength;

            const angle =
              Math.PI - percentage * Math.PI;

            const dotX =
              100 + 80 * Math.cos(angle);

            const dotY =
              100 - 80 * Math.sin(angle);

            return `
              <svg
                viewBox="0 0 200 108"
                class="gauge-svg"
              >
                <defs>

                  <linearGradient
                    id="${gradientId}"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%"
                  >
                    <stop
                      offset="0%"
                      stop-color="${color.start}"
                    />

                    <stop
                      offset="100%"
                      stop-color="${color.end}"
                    />
                  </linearGradient>

                  <filter id="${glowId}">

                    <feGaussianBlur
                      stdDeviation="3"
                      result="blur"
                    />

                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>

                  </filter>

                </defs>

                <path
                  d="M 20 100 A 80 80 0 0 1 180 100"
                  pathLength="100"
                  fill="none"
                  stroke="var(--solar-gauge-track)"
                  stroke-width="13"
                  stroke-linecap="round"
                />

                <path
                  d="M 20 100 A 80 80 0 0 1 180 100"
                  pathLength="100"
                  fill="none"
                  stroke="url(#${gradientId})"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-dasharray="
                    ${visibleLength}
                    ${remainingLength}
                  "
                  filter="url(#${glowId})"
                />

                <circle
                  cx="${dotX}"
                  cy="${dotY}"
                  r="7"
                  fill="${color.start}"
                  filter="url(#${glowId})"
                />

              </svg>
            `;
          }

          /*
           * ========================================================
           * AKTUELLE LEISTUNGEN
           * ========================================================
           */

          const pvPower = getPower(
            CONFIG.entities.pvPowerTotal
          );

          const housePower = getPower(
            CONFIG.entities.housePower
          );

          const gridExportPower = getPower(
            CONFIG.entities.gridExportPower
          );

          const gridImportPower = getPower(
            CONFIG.entities.gridImportPower
          );

          const batteryPower = getPower(
            CONFIG.entities.batteryPower
          );

          /*
           * ========================================================
           * TAGESENERGIEN
           * ========================================================
           */

          const solarToday = getEnergy(
            CONFIG.entities.pvEnergyToday
          );

          const exportToday = getEnergy(
            CONFIG.entities.gridExportEnergyToday
          );

          const importToday = getEnergy(
            CONFIG.entities.gridImportEnergyToday
          );

          const batteryInputToday = getEnergy(
            CONFIG.entities.batteryChargeEnergyToday
          );

          const batteryOutputToday = getEnergy(
            CONFIG.entities.batteryDischargeEnergyToday
          );

          /*
           * Hausverbrauch aus Energiebilanz:
           *
           * PV
           * + Netzimport
           * + Batterieentladung
           * - Netzeinspeisung
           * - Batterieladung
           */

          const calculatedHouseToday = Math.max(
            0,
            solarToday +
            importToday +
            batteryOutputToday -
            exportToday -
            batteryInputToday
          );

          const houseToday =
            CONFIG.entities.houseEnergyToday
              ? getEnergy(CONFIG.entities.houseEnergyToday)
              : calculatedHouseToday;

          /*
           * ========================================================
           * BATTERIEWERTE
           * ========================================================
           */

          const batterySoc = getNumber(
            CONFIG.entities.batterySoc
          );

          const remainingBatteryEnergy = getEnergy(
            CONFIG.entities.batteryEnergyRemaining
          );

          const normalizedSoc =
            Math.min(Math.max(batterySoc, 0), 100);

          let batteryStatus = 'STANDBY';
          let batteryColor = '#90a4ae';
          let batteryIcon = 'mdi:battery';

          if (batteryPower > 0.05) {
            batteryStatus = 'LÄDT';
            batteryColor = '#76ff7a';
            batteryIcon = 'mdi:battery-charging';
          } else if (batteryPower < -0.05) {
            batteryStatus = 'ENTLÄDT';
            batteryColor = '#ffb43b';
            batteryIcon = 'mdi:battery-arrow-down';
          }

          if (batterySoc <= 20) {
            batteryColor = '#ff5252';
          }

          /*
           * ========================================================
           * NETZSTATUS
           * ========================================================
           */

          let gridTitle = 'NETZ';
          let gridCurrentPower = 0;
          let gridIcon = 'mdi:transmission-tower';

          if (gridExportPower > 0.001) {
            gridTitle = 'EINSPEISUNG';
            gridCurrentPower = gridExportPower;
            gridIcon = 'mdi:transmission-tower-export';
          } else if (gridImportPower > 0.001) {
            gridTitle = 'NETZBEZUG';
            gridCurrentPower = gridImportPower;
            gridIcon = 'mdi:transmission-tower-import';
          }

          /*
           * ========================================================
           * WEITERE WERTE
           * ========================================================
           */

          const compensation = getNumber(
            CONFIG.entities.compensationToday
          );

          const runtimeSensor = getSensor(
            CONFIG.entities.batteryRuntime
          );

          const runtimeRaw =
            runtimeSensor?.state || 'Unbekannt';

          const runtime =
            runtimeRaw === 'unknown' ||
            runtimeRaw === 'unavailable'
              ? 'Unbekannt'
              : runtimeRaw;

          /*
           * ========================================================
           * MPPT / TRACKER – DYNAMISCH
           * ========================================================
           */

          const trackers = CONFIG.trackers
            .filter((tracker) =>
              tracker &&
              tracker.power &&
              Number(tracker.maxKw) > 0
            )
            .map((tracker, index) => {

              const power = getPower(tracker.power);
              const energyToday =
                tracker.energyToday
                  ? getEnergy(tracker.energyToday)
                  : 0;

              const colorStart =
                tracker.colorStart || '#ff9800';

              const colorEnd =
                tracker.colorEnd || colorStart;

              const name =
                tracker.name || `MPPT ${index + 1}`;

              const maxKw =
                Number(tracker.maxKw) || 1;

              const gauge = createGauge(
                power,
                maxKw,
                `mppt-gradient-${index}`,
                `mppt-glow-${index}`,
                {
                  start: colorStart,
                  end: colorEnd
                }
              );

              return {
                ...tracker,
                index,
                name,
                maxKw,
                power,
                energyToday,
                colorStart,
                colorEnd,
                gauge
              };
            });

          const pvMaximum = trackers.reduce(
            (sum, tracker) => sum + tracker.maxKw,
            0
          );

          const pvPercentRaw =
            pvMaximum > 0
              ? (pvPower / pvMaximum) * 100
              : 0;

          const pvPercentBar =
            Math.min(Math.max(pvPercentRaw, 0), 100);

          const mpptTotalPower = trackers.reduce(
            (sum, tracker) =>
              sum + Math.max(tracker.power, 0),
            0
          );

          const pvScale =
            mpptTotalPower > pvMaximum &&
            mpptTotalPower > 0
              ? pvMaximum / mpptTotalPower
              : 1;

          const trackerBarData = trackers.map(
            (tracker) => ({
              ...tracker,
              barWidth:
                pvMaximum > 0
                  ? Math.min(
                      Math.max(
                        (
                          (
                            tracker.power *
                            pvScale
                          ) /
                          pvMaximum
                        ) * 100,
                        0
                      ),
                      100
                    )
                  : 0
            })
          );

          const mpptCardsHtml = trackers
            .map((tracker) => `
              <div
                class="panel mppt-panel"
                style="
                  --tracker-start:${tracker.colorStart};
                  --tracker-end:${tracker.colorEnd};
                "
              >

                <div class="mppt-title">
                  ${tracker.name}
                </div>

                <div class="mppt-gauge">

                  ${tracker.gauge}

                  <div class="mppt-current-value">
                    ${formatPower(tracker.power)}
                    <span>kW</span>
                  </div>

                </div>

                <div class="mppt-daily-box">

                  <ha-icon
                    icon="mdi:lightning-bolt"
                  ></ha-icon>

                  <div>

                    <div class="mppt-daily-value">
                      ${formatEnergy(tracker.energyToday)}
                      kWh
                    </div>

                    <div class="small-label">
                      HEUTE · MAX ${formatNumber(
                        tracker.maxKw,
                        2,
                        2
                      )} kW
                    </div>

                  </div>

                </div>

              </div>
            `)
            .join('');

          const pvSegmentsHtml = trackerBarData
            .map((tracker) => `
              <div
                class="pv-segment"
                title="${tracker.name}"
                style="
                  width:${tracker.barWidth}%;
                  background:
                    linear-gradient(
                      90deg,
                      ${tracker.colorStart},
                      ${tracker.colorEnd}
                    );
                  box-shadow:
                    0 0 9px ${tracker.colorStart}88;
                "
              ></div>
            `)
            .join('');

          const trackerFooterHtml = trackers
            .map((tracker) => `
              <span
                style="color:${tracker.colorEnd};"
              >
                ${tracker.name.replace('MPPT ', '')}
                ${formatPower(tracker.power)}
              </span>
            `)
            .join('');

          const batteryMaximum = CONFIG.limits.batteryCapacityKwh;

          const batteryEnergyPercentRaw =
            batteryMaximum > 0
              ? (remainingBatteryEnergy / batteryMaximum) * 100
              : 0;

          const batteryBarPercent =
            Math.min(
              Math.max(batteryEnergyPercentRaw, 0),
              100
            );

          /*
           * ========================================================
           * AUSGABE
           * ========================================================
           */

          return `
            <div class="solar-dashboard">

              <!-- =============================================== -->
              <!-- MPPT / TRACKER – DYNAMISCH -->
              <!-- =============================================== -->

              <div
                class="mppt-grid"
                style="--mppt-count:${Math.max(trackers.length, 1)};"
              >
                ${mpptCardsHtml}
              </div>

              <!-- =============================================== -->
              <!-- LIVE-ENERGIEFLUSS -->
              <!-- =============================================== -->

              <div class="panel live-panel">

                <div class="live-grid">

                  <!-- PV -->

                  <div class="live-item live-pv">

                    <ha-icon
                      icon="mdi:solar-power"
                    ></ha-icon>

                    <div class="live-title">
                      PV
                    </div>

                    <div class="live-current">
                      ${formatPower(pvPower)}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">
                      <span>
                        Heute ${formatEnergy(solarToday)} kWh
                      </span>
                      <span>
                        Max. ${formatNumber(pvMaximum, 2, 2)} kW
                      </span>
                    </div>

                  </div>

                  <!-- HAUS -->

                  <div class="live-item live-house">

                    <ha-icon
                      icon="mdi:home-lightning-bolt"
                    ></ha-icon>

                    <div class="live-title">
                      HAUS
                    </div>

                    <div class="live-current">
                      ${formatPower(housePower)}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">
                      <span>
                        Heute ${formatEnergy(houseToday)} kWh
                      </span>
                      <span>
                        Aktuell ${formatPower(housePower)} kW
                      </span>
                    </div>

                  </div>

                  <!-- NETZ -->

                  <div class="live-item live-grid-value">

                    <ha-icon
                      icon="${gridIcon}"
                    ></ha-icon>

                    <div class="live-title">
                      NETZ
                    </div>

                    <div class="live-current">
                      ${formatPower(
                        Math.abs(gridCurrentPower)
                      )}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">

                      <span>
                        Import
                        ${formatEnergy(importToday)}
                        kWh
                      </span>

                      <span>
                        Export
                        ${formatEnergy(exportToday)}
                        kWh
                      </span>

                    </div>

                  </div>

                  <!-- BATTERIE -->

                  <div class="live-item live-battery">

                    <ha-icon
                      icon="${batteryIcon}"
                    ></ha-icon>

                    <div class="live-title">
                      BATTERIE
                    </div>

                    <div class="live-current">
                      ${formatPower(
                        Math.abs(batteryPower)
                      )}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">

                      <span>
                        Laden
                        ${formatEnergy(batteryInputToday)}
                        kWh
                      </span>

                      <span>
                        Entladen
                        ${formatEnergy(batteryOutputToday)}
                        kWh
                      </span>

                    </div>

                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- PV TOTAL – V5 QUERBALKEN -->
              <!-- =============================================== -->

              <div class="panel pv-total-panel v5-bar-panel">

                <div class="v5-bar-header centered-header">

                  <div class="v5-bar-title">
                    PV TOTAL
                  </div>

                  <div class="v5-bar-main">
                    ${formatPower(pvPower)}
                    <span>kW</span>
                  </div>

                </div>

                <div class="pv-split-track">
                  ${pvSegmentsHtml}
                </div>

                <div class="v7-pv-footer">

                  <div class="tracker-footer-values">
                    ${trackerFooterHtml}
                  </div>

                  <div class="pv-percent">
                    ${formatNumber(
                      pvPercentRaw,
                      0,
                      0
                    )} %
                    ·
                    ${formatEnergy(solarToday)} kWh heute
                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- BATTERIE – V5 QUERBALKEN -->
              <!-- =============================================== -->

              <div class="panel battery-panel v5-bar-panel">

                <div class="v5-bar-header centered-header">

                  <div class="v5-bar-title">
                    BATTERIE
                  </div>

                  <div class="v5-bar-main">
                    ${formatNumber(
                      batterySoc,
                      0,
                      0
                    )}
                    <span>%</span>
                  </div>

                </div>

                <div class="battery-horizontal-track">

                  <div
                    class="battery-horizontal-fill"
                    style="
                      width:${batteryBarPercent}%;
                      background:${batteryColor};
                      box-shadow:0 0 10px ${batteryColor};
                    "
                  ></div>

                </div>

                <div class="v5-bar-footer">

                  <span>
                    ${formatEnergy(remainingBatteryEnergy)}
                    / ${formatNumber(CONFIG.limits.batteryCapacityKwh, 2, 2)} kWh
                  </span>

                  <span
                    class="v5-footer-center"
                    style="color:${batteryColor};"
                  >
                    ${batteryStatus}
                  </span>

                  <span>
                    ${formatPower(
                      Math.abs(batteryPower)
                    )} kW
                  </span>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- VERGÜTUNG -->
              <!-- =============================================== -->

              <div class="panel information-panel payment-panel">

                <ha-icon
                  icon="mdi:transmission-tower-export"
                ></ha-icon>

                <div class="information-content">

                  <div class="information-title">
                    Vergütung heute
                  </div>

                  <div class="information-value">
                    ${formatNumber(
                      compensation,
                      2,
                      2
                    )} €
                  </div>

                  <div class="information-subtitle">
                    Einspeiseerlös
                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- RESTLAUFZEIT -->
              <!-- =============================================== -->

              <div class="panel information-panel runtime-panel">

                <ha-icon
                  icon="mdi:battery-clock-outline"
                ></ha-icon>

                <div class="information-content">

                  <div class="information-title">
                    Restlaufzeit
                  </div>

                  <div class="information-value">
                    ${runtime}
                  </div>

                  <div class="information-subtitle">
                    Batterie
                  </div>

                </div>

              </div>

            </div>
          `;
        ]]]
    styles:
      card:
        - padding: 0
        - border: none
        - box-shadow: none
        - background: transparent
        - overflow: visible
      grid:
        - grid-template-areas: '"dashboard"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        dashboard:
          - width: 100%
          - overflow: visible
    extra_styles: |
      /*
       * ==========================================================
       * GRUNDLAYOUT
       * ==========================================================
       */

      .solar-dashboard {
        --solar-surface: var(--ha-card-background, var(--card-background-color));
        --solar-surface-soft: color-mix(in srgb, var(--solar-surface) 94%, var(--primary-text-color) 6%);
        --solar-surface-strong: color-mix(in srgb, var(--solar-surface) 88%, var(--primary-text-color) 12%);
        --solar-text: var(--primary-text-color);
        --solar-text-secondary: var(--secondary-text-color);
        --solar-border: var(--divider-color, color-mix(in srgb, var(--primary-text-color) 14%, transparent));
        --solar-divider: var(--divider-color, color-mix(in srgb, var(--primary-text-color) 16%, transparent));
        --solar-gauge-track: color-mix(in srgb, var(--primary-text-color) 13%, transparent);
        --solar-inset: color-mix(in srgb, var(--primary-text-color) 5%, transparent);
        --solar-track: color-mix(in srgb, var(--primary-text-color) 8%, transparent);
        --solar-shadow: 0 8px 24px rgba(0,0,0,0.16);

        box-sizing: border-box;
        display: grid;
        width: 100%;
        gap: 10px;
        color: var(--solar-text);

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        grid-template-areas:
          "mppt1 mppt2"
          "pv battery"
          "live live"
          "payment runtime";
      }

      .panel {
        box-sizing: border-box;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--solar-border);
        border-radius: 24px;
        background:
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
        box-shadow: var(--solar-shadow);
      }

      .mppt1-panel {
        grid-area: mppt1;
      }

      .mppt2-panel {
        grid-area: mppt2;
      }

      .live-panel {
        grid-area: live;
      }

      .pv-total-panel {
        grid-area: pv;
      }

      .battery-panel {
        grid-area: battery;
      }

      .payment-panel {
        grid-area: payment;
      }

      .runtime-panel {
        grid-area: runtime;
      }

      /*
       * ==========================================================
       * MPPT
       * ==========================================================
       */

      .mppt-panel {
        display: flex;
        flex-direction: column;
        height: 225px;
        padding: 15px 14px 13px 14px;
      }

      .mppt-title {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
      }

      .mppt-gauge {
        position: relative;
        height: 112px;
        margin-top: 3px;
      }

      .gauge-svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .mppt-current-value {
        position: absolute;
        right: 0;
        bottom: 5px;
        left: 0;
        text-align: center;
        font-size: 29px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .mppt-current-value span {
        font-size: 13px;
        opacity: 0.70;
      }

      .mppt-daily-box {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 82%;
        min-height: 48px;
        margin: auto auto 0 auto;
        padding: 7px 8px;
        border: 1px solid var(--solar-border);
        border-radius: 16px;
        background: var(--solar-inset);
        text-align: center;
      }

      .mppt1-panel .mppt-daily-box ha-icon {
        color: #ffd740;
      }

      .mppt2-panel .mppt-daily-box ha-icon {
        color: #76ff7a;
      }

      .mppt-daily-box ha-icon {
        width: 25px;
        height: 25px;
      }

      .mppt-daily-value {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * ==========================================================
       * LIVE-ENERGIEFLUSS
       * ==========================================================
       */

      .live-panel {
        height: 155px;
      }

      .live-grid {
        box-sizing: border-box;
        display: grid;
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
        width: 100%;
        height: 100%;
        padding: 12px 5px;
      }

      .live-item {
        box-sizing: border-box;
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        border-right:
          1px solid var(--solar-divider);
        text-align: center;
      }

      .live-item:last-child {
        border-right: none;
      }

      .live-item ha-icon {
        width: 25px;
        height: 25px;
        margin-bottom: 5px;
      }

      .live-title {
        width: 100%;
        overflow: hidden;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.68;
      }

      .live-current {
        margin-top: 5px;
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .live-current span {
        font-size: 9px;
        opacity: 0.68;
      }

      .live-daily,
      .live-double-value {
        width: 100%;
        margin-top: 7px;
        overflow: hidden;
        color: var(--solar-text-secondary);
        font-size: 7.5px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
      }

      .live-double-value {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .live-double-value span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .live-pv ha-icon,
      .live-pv .live-current {
        color: #ffd740;
      }

      .live-house ha-icon,
      .live-house .live-current {
        color: #64b5f6;
      }

      .live-grid-value ha-icon,
      .live-grid-value .live-current {
        color: #26c6da;
      }

      .live-battery ha-icon,
      .live-battery .live-current {
        color: #76ff7a;
      }

      /*
       * ==========================================================
       * PV TOTAL
       * ==========================================================
       */

      .pv-total-panel {
        display: grid;
        grid-template-columns: 65px 1fr auto;
        align-items: center;
        height: 145px;
        padding: 18px 24px;

        background:
          radial-gradient(
            circle at 85% 120%,
            rgba(255,193,7,0.26),
            transparent 48%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .pv-total-icon ha-icon {
        width: 45px;
        height: 45px;
        color: #ffd740;
        filter:
          drop-shadow(
            0 0 9px rgba(255,215,64,0.45)
          );
      }

      .section-label {
        font-size: 13px;
        letter-spacing: 1.2px;
        opacity: 0.58;
      }

      .pv-total-power {
        margin-top: 3px;
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .pv-total-power span {
        font-size: 16px;
        opacity: 0.72;
      }

      .pv-total-status {
        margin-top: 8px;
        color: #ffd740;
        font-size: 10px;
        letter-spacing: 1.3px;
      }

      .pv-total-daily {
        padding-left: 12px;
        text-align: right;
      }

      .pv-total-daily-value {
        margin-top: 5px;
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * ==========================================================
       * BATTERIE
       * ==========================================================
       */

      .battery-panel {
        display: grid;
        grid-template-columns: 68px 1fr auto;
        align-items: center;
        height: 165px;
        padding: 18px 24px;

        background:
          radial-gradient(
            circle at 5% 50%,
            rgba(118,255,122,0.12),
            transparent 36%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .battery-symbol {
        position: relative;
        width: 43px;
        height: 82px;
      }

      .battery-tip {
        position: absolute;
        top: -5px;
        left: 13px;
        width: 17px;
        height: 6px;
        border-radius: 3px 3px 0 0;
        background: color-mix(in srgb, var(--solar-text) 68%, transparent);
      }

      .battery-body {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 3px solid color-mix(in srgb, var(--solar-text) 68%, transparent);
        border-radius: 8px;
        background: var(--solar-inset);
      }

      .battery-fill {
        position: absolute;
        right: 4px;
        bottom: 4px;
        left: 4px;
        min-height: 3px;
        border-radius: 4px;
        transition: height 0.7s ease;
      }

      .battery-soc {
        margin-top: 4px;
        font-size: 39px;
        font-weight: 700;
        line-height: 1;
      }

      .battery-soc span {
        font-size: 18px;
      }

      .battery-status {
        margin-top: 9px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
      }

      .battery-details {
        padding-left: 12px;
        text-align: right;
      }

      .battery-detail-value {
        margin-top: 3px;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }

      .battery-detail-gap {
        margin-top: 12px;
      }

      /*
       * ==========================================================
       * VERGÜTUNG UND RESTLAUFZEIT
       * ==========================================================
       */

      .information-panel {
        display: grid;
        grid-template-columns: 54px 1fr;
        align-items: center;
        height: 125px;
        padding: 16px 20px;
      }

      .information-panel ha-icon {
        width: 36px;
        height: 36px;
      }

      .payment-panel {
        background:
          linear-gradient(
            145deg,
            color-mix(in srgb, var(--solar-surface) 86%, #42a5f5 14%),
            var(--solar-surface)
          );
      }

      .payment-panel ha-icon,
      .payment-panel .information-title {
        color: #64b5f6;
      }

      .payment-panel ha-icon {
        filter:
          drop-shadow(
            0 0 7px rgba(66,165,245,0.50)
          );
      }

      .runtime-panel {
        background:
          linear-gradient(
            145deg,
            color-mix(in srgb, var(--solar-surface) 86%, #8e5cff 14%),
            var(--solar-surface)
          );
      }

      .runtime-panel ha-icon,
      .runtime-panel .information-title {
        color: #b388ff;
      }

      .runtime-panel ha-icon {
        filter:
          drop-shadow(
            0 0 7px rgba(171,108,255,0.50)
          );
      }

      .information-title {
        font-size: 13px;
        font-weight: 700;
      }

      .information-value {
        margin-top: 4px;
        font-size: 24px;
        font-weight: 700;
        white-space: nowrap;
      }

      .information-subtitle {
        margin-top: 4px;
        color: var(--solar-text-secondary);
        font-size: 10px;
      }

      .small-label {
        font-size: 9px;
        letter-spacing: 1px;
        opacity: 0.48;
      }

      /*
       * ==========================================================
       * QUERFORMAT / TABLET / DESKTOP
       * ==========================================================
       */

      @media screen and (min-width: 700px) {

        .solar-dashboard {
          gap: 12px;

          grid-template-columns:
            repeat(12, minmax(0, 1fr));

          grid-template-areas:
            "mppt1 mppt1 mppt1
             mppt2 mppt2 mppt2
             live live live live live live"

            "pv pv pv pv pv pv
             battery battery battery battery battery battery"

            "payment payment payment payment payment payment
             runtime runtime runtime runtime runtime runtime";
        }

        .mppt-panel,
        .live-panel {
          height: 195px;
        }

        .mppt-panel {
          padding: 13px 12px 12px 12px;
        }

        .mppt-gauge {
          height: 103px;
        }

        .mppt-daily-box {
          min-height: 42px;
        }

        .live-grid {
          padding: 15px 8px;
        }

        .live-item {
          padding: 0 9px;
        }

        .live-item ha-icon {
          width: 30px;
          height: 30px;
          margin-bottom: 8px;
        }

        .live-title {
          font-size: 9px;
        }

        .live-current {
          margin-top: 8px;
          font-size: 21px;
        }

        .live-current span {
          font-size: 11px;
        }

        .live-daily,
        .live-double-value {
          margin-top: 9px;
          font-size: 9px;
        }

        .pv-total-panel,
        .battery-panel {
          height: 155px;
        }

        .information-panel {
          height: 115px;
        }
      }

      /*
       * ==========================================================
       * BREITER DESKTOP
       * ==========================================================
       */

      @media screen and (min-width: 1200px) {

        .solar-dashboard {
          max-width: 1600px;
          margin: 0 auto;
          gap: 14px;
        }

        .mppt-panel,
        .live-panel {
          height: 215px;
        }

        .mppt-title {
          font-size: 20px;
        }

        .mppt-current-value {
          font-size: 33px;
        }

        .live-item ha-icon {
          width: 34px;
          height: 34px;
        }

        .live-title {
          font-size: 10px;
        }

        .live-current {
          font-size: 24px;
        }

        .live-daily,
        .live-double-value {
          font-size: 10px;
        }

        .pv-total-panel,
        .battery-panel {
          height: 165px;
        }

        .information-panel {
          height: 125px;
        }
      }

      /*
       * ==========================================================
       * SEHR SCHMALE HANDYS
       * ==========================================================
       */

      @media screen and (max-width: 420px) {

        .solar-dashboard {
          gap: 8px;
        }

        .panel {
          border-radius: 20px;
        }

        .mppt-panel {
          height: 210px;
          padding-right: 9px;
          padding-left: 9px;
        }

        .mppt-title {
          font-size: 16px;
        }

        .mppt-current-value {
          font-size: 25px;
        }

        .mppt-daily-box {
          width: 92%;
        }

        .mppt-daily-value {
          font-size: 13px;
        }

        .live-panel {
          height: 160px;
        }

        .live-item {
          padding-right: 3px;
          padding-left: 3px;
        }

        .live-item ha-icon {
          width: 23px;
          height: 23px;
        }

        .live-title {
          font-size: 6.5px;
        }

        .live-current {
          font-size: 15px;
        }

        .live-daily,
        .live-double-value {
          font-size: 6.8px;
        }

        .pv-total-panel {
          grid-template-columns: 52px 1fr auto;
          padding-right: 16px;
          padding-left: 16px;
        }

        .pv-total-icon ha-icon {
          width: 38px;
          height: 38px;
        }

        .pv-total-power {
          font-size: 29px;
        }

        .pv-total-daily-value {
          font-size: 14px;
        }

        .battery-panel {
          grid-template-columns: 56px 1fr auto;
          padding-right: 16px;
          padding-left: 16px;
        }

        .battery-symbol {
          width: 37px;
          height: 72px;
        }

        .battery-soc {
          font-size: 34px;
        }

        .battery-detail-value {
          font-size: 13px;
        }

        .information-panel {
          grid-template-columns: 44px 1fr;
          padding-right: 12px;
          padding-left: 12px;
        }

        .information-panel ha-icon {
          width: 31px;
          height: 31px;
        }

        .information-title {
          font-size: 11px;
        }

        .information-value {
          font-size: 21px;
        }
      }

      
      /*
       * ==========================================================
       * RESPONSIVE KORREKTUR
       * Aktualisiert: 2026-08-06 21:50
       * ==========================================================
       */

      /* Gesamtes Dashboard wirklich auf volle Breite setzen */

      .solar-dashboard {
        width: 100%;
        max-width: none;
        margin: 0;
      }


      /*
       * ==========================================================
       * IPHONE HOCHFORMAT
       * ==========================================================
       */

      @media screen and (max-width: 699px) {

        .solar-dashboard {
          gap: 7px;

          grid-template-columns:
            repeat(2, minmax(0, 1fr));

          grid-template-areas:
            "mppt1 mppt2"
            "pv battery"
            "live live"
            "payment runtime";
        }

        .panel {
          border-radius: 19px;
        }

        /* MPPT kompakter */

        .mppt-panel {
          height: 190px;
          padding: 11px 9px 9px 9px;
        }

        .mppt-title {
          font-size: 15px;
        }

        .mppt-gauge {
          height: 92px;
          margin-top: 1px;
        }

        .mppt-current-value {
          bottom: 2px;
          font-size: 24px;
        }

        .mppt-current-value span {
          font-size: 10px;
        }

        .mppt-daily-box {
          width: 94%;
          min-height: 39px;
          padding: 4px 5px;
          border-radius: 12px;
        }

        .mppt-daily-box ha-icon {
          width: 20px;
          height: 20px;
        }

        .mppt-daily-value {
          font-size: 12px;
        }

        .small-label {
          font-size: 7px;
        }

        /* Live-Leiste */

        .live-panel {
          height: 92px;
        }

        .live-grid {
          padding: 8px 3px;
        }

        .live-item {
          padding: 0 3px;
        }

        .live-item ha-icon {
          width: 21px;
          height: 21px;
          margin-bottom: 4px;
        }

        .live-title {
          font-size: 6px;
          letter-spacing: 0;
        }

        .live-current {
          margin-top: 4px;
          font-size: 14px;
        }

