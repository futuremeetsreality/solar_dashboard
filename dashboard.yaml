  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update: all
    custom_fields:
      dashboard: |
        [[[

          /*
           * ========================================================
           * USER CONFIGURATION / BENUTZERKONFIGURATION – ONLY EDIT THIS BLOCK / NUR DIESEN BLOCK ANPASSEN
           * ========================================================
           *
           * Alle Entity-IDs dürfen aus beliebigen Integrationen stammen.
           * Entscheidend ist nur, dass sie den beschriebenen Messwert liefern.
           *
           * Hinweise:
           * - Leistung: W oder kW wird automatisch erkannt.
           * - Energie: Wh oder kWh wird automatisch erkannt.
           * - Optionale Sensoren dürfen als leerer String "" gesetzt werden.
           */

          const CONFIG = {

            // UI language: 'auto', 'de' or 'en'.
            // auto follows the Home Assistant language and falls back to English.
            language: 'auto',

            // Display profile: 'auto', 'desktop', 'tablet' or 'wall'.
            // 'wall' is optimized for permanently mounted tablets.
            displayMode: 'auto',

            // Rendering profile: 'auto', 'high', 'balanced' or 'low'.
            // 'auto' selects a safe profile from browser capabilities.
            performanceMode: 'auto',

            /*
             * ======================================================
             * MPPT / TRACKER
             * ======================================================
             *
             * Beliebig viele Tracker möglich.
             *
             * 1 Tracker:
             *   Nur einen Block in dieser Liste stehen lassen.
             *
             * 3 Tracker:
             *   Einen dritten Block hinzufügen.
             *
             * Das Dashboard erzeugt die MPPT-Karten, Farben,
             * Maximalwerte und den geteilten PV-Balken automatisch.
             *
             * Pflicht pro Tracker:
             * - name        = Anzeigename
             * - power       = aktuelle Leistung, W oder kW
             * - energyToday = Tagesertrag, Wh oder kWh
             * - maxKw       = maximale Generatorleistung dieses Trackers in kW
             *
             * Farben sind frei wählbar.
             */

            /*
             * MODULE VISIBILITY AND ORDER / MODUL-SICHTBARKEIT UND REIHENFOLGE
             *
             * Available / Verfügbar:
             * mppt    = tracker gauges / Tracker-Gauges
             * pvTotal = total PV + tracker split bar / PV Gesamt + Tracker-Balken
             * battery = SoC, remaining energy, power/status / SoC, Restenergie, Leistung/Status
             * live    = PV, house, grid, battery live overview / PV-, Haus-, Netz-, Batterie-Liveübersicht
             * payment = today's feed-in revenue / heutiger Einspeiseerlös
             * runtime = estimated battery runtime / geschätzte Batterie-Restlaufzeit
             *
             * Remove an ID to hide a module. Reorder IDs to change display order.
             * ID entfernen = Modul ausblenden. IDs verschieben = Reihenfolge ändern.
             * Power Flux remains the separate first Lovelace card.
             * Power Flux bleibt die separate erste Lovelace-Karte.
             */
            modules: [
                'mppt',
                'pvTotal',
                'battery',
                'live',
                'payment',
                'runtime'
              ],

            trackers: [
                {
                  enabled: true,
                  name: 'MPPT 1',
                  power: 'sensor.solax_inverter_pv_power_1',
                  energyToday: 'sensor.technikraum_solax_inverter_mppt_1_tageszahler',
                  maxKw: 9.10,
                  colorStart: '#ff9800',
                  colorEnd: '#ffd740'
                },
                {
                  enabled: true,
                  name: 'MPPT 2',
                  power: 'sensor.solax_inverter_pv_power_2',
                  energyToday: 'sensor.technikraum_solax_inverter_mppt_2_tageszahler',
                  maxKw: 6.37,
                  colorStart: '#43a047',
                  colorEnd: '#76ff7a'
                },
                {
                  enabled: false,
                  name: 'MPPT 3',
                  power: '',
                  energyToday: '',
                  maxKw: 0,
                  colorStart: '#2196f3',
                  colorEnd: '#00e5ff'
                },
                {
                  enabled: false,
                  name: 'MPPT 4',
                  power: '',
                  energyToday: '',
                  maxKw: 0,
                  colorStart: '#ab47bc',
                  colorEnd: '#e040fb'
                }
              ],

            entities: {

              /*
               * PV GESAMT
               */

              // [PFLICHT] Aktuelle gesamte PV-Leistung.
              // Messwert: Summe aller aktuell erzeugenden PV-Eingänge.
              // Einheit: W oder kW.
              pvPowerTotal:
                'sensor.solax_inverter_pv_power_total',

              // [PFLICHT] Gesamte heute erzeugte PV-Energie.
              // Messwert: aufsummierte Solarproduktion seit Mitternacht.
              // Einheit: Wh oder kWh.
              pvEnergyToday:
                'sensor.solax_inverter_today_s_solar_energy',

              /*
               * HAUS
               */

              // [PFLICHT] Aktueller Hausverbrauch.
              // Messwert: momentane gesamte Verbraucherleistung des Hauses.
              // Einheit: W oder kW.
              housePower:
                'sensor.solax_inverter_house_load',

              // [OPTIONAL] Hausverbrauch seit Mitternacht.
              // Messwert: aufsummierter Energieverbrauch des Hauses heute.
              // Einheit: Wh oder kWh.
              // Wenn "", wird der Tagesverbrauch aus PV, Netz und Batterie berechnet.
              houseEnergyToday:
                'sensor.technikraum_solax_inverter_hausverbrauch_heute',

              /*
               * NETZ
               */

              // [PFLICHT] Aktueller Netzbezug.
              // Messwert: Leistung, die momentan AUS dem Stromnetz bezogen wird.
              // Einheit: W oder kW. Idealerweise positiver Wert.
              gridImportPower:
                'sensor.solax_inverter_grid_import',

              // [PFLICHT] Aktuelle Netzeinspeisung.
              // Messwert: Leistung, die momentan INS Stromnetz eingespeist wird.
              // Einheit: W oder kW. Idealerweise positiver Wert.
              gridExportPower:
                'sensor.solax_inverter_grid_export',

              // [PFLICHT] Heute aus dem Netz bezogene Energie.
              // Messwert: Netzimport seit Mitternacht.
              // Einheit: Wh oder kWh.
              gridImportEnergyToday:
                'sensor.solax_inverter_today_s_import_energy',

              // [PFLICHT] Heute ins Netz eingespeiste Energie.
              // Messwert: Netzeinspeisung seit Mitternacht.
              // Einheit: Wh oder kWh.
              gridExportEnergyToday:
                'sensor.solax_inverter_today_s_export_energy',

              /*
               * BATTERIE
               */

              // [PFLICHT] Ladezustand der Batterie.
              // Messwert: State of Charge.
              // Einheit: %.
              batterySoc:
                'sensor.solax_inverter_battery_1_capacity',

              // [PFLICHT] Aktuelle Batterieleistung.
              // Messwert: momentane Lade-/Entladeleistung.
              // Einheit: W oder kW.
              // Dashboard-Logik: positiv = Laden, negativ = Entladen.
              batteryPower:
                'sensor.solax_inverter_battery_1_power_charge',

              // [PFLICHT] Aktuell noch gespeicherte/verfügbare Batterieenergie.
              // Einheit: Wh oder kWh.
              batteryEnergyRemaining:
                'sensor.solax_inverter_remaining_battery_energy',

              // [PFLICHT] Heute in die Batterie geladene Energie.
              // Einheit: Wh oder kWh.
              batteryChargeEnergyToday:
                'sensor.solax_inverter_battery_input_energy_today',

              // [PFLICHT] Heute aus der Batterie entladene Energie.
              // Einheit: Wh oder kWh.
              batteryDischargeEnergyToday:
                'sensor.solax_inverter_battery_output_energy_today',

              /*
               * OPTIONALE ZUSATZWERTE
               */

              // [OPTIONAL] Heutige Einspeisevergütung / Erlös.
              // Einheit: EUR.
              compensationToday:
                'sensor.ugendorf_electricity_costs_tages_einspeisung',

              // [OPTIONAL] Geschätzte Restlaufzeit der Batterie.
              batteryRuntime:
                'sensor.ugendorf_battery_restlaufzeit'
            },

            limits: {
              // Batteriekapazität in kWh.
              batteryCapacityKwh: 12.50
            }
          };

          /*
           * ========================================================
           * INTERNATIONALIZATION / I18N
           * ========================================================
           */

          const I18N = {
            de: {
              today: 'Heute',
              todayUpper: 'HEUTE',
              current: 'Aktuell',
              max: 'Max.',
              maxUpper: 'MAX',
              pv: 'PV',
              pvTotal: 'PV TOTAL',
              house: 'HAUS',
              grid: 'NETZ',
              import: 'Import',
              export: 'Export',
              battery: 'BATTERIE',
              charge: 'Laden',
              discharge: 'Entladen',
              compensationToday: 'Vergütung heute',
              feedInRevenue: 'Einspeiseerlös',
              runtime: 'Restlaufzeit',
              remaining: 'verbleibend',
              unknown: 'Unbekannt',
              standby: 'STANDBY',
              charging: 'LÄDT',
              discharging: 'ENTLÄDT'
            },
            en: {
              today: 'Today',
              todayUpper: 'TODAY',
              current: 'Current',
              max: 'Max.',
              maxUpper: 'MAX',
              pv: 'PV',
              pvTotal: 'PV TOTAL',
              house: 'HOUSE',
              grid: 'GRID',
              import: 'Import',
              export: 'Export',
              battery: 'BATTERY',
              charge: 'Charge',
              discharge: 'Discharge',
              compensationToday: 'Revenue today',
              feedInRevenue: 'Feed-in revenue',
              runtime: 'Runtime',
              remaining: 'remaining',
              unknown: 'Unknown',
              standby: 'STANDBY',
              charging: 'CHARGING',
              discharging: 'DISCHARGING'
            }
          };

          const configuredLanguage =
            String(CONFIG.language || 'auto').toLowerCase();

          const detectedLanguage =
            String(
              hass?.language ||
              window?.navigator?.language ||
              'en'
            ).toLowerCase();

          const language =
            configuredLanguage === 'de' ||
            configuredLanguage === 'en'
              ? configuredLanguage
              : detectedLanguage.startsWith('de')
                ? 'de'
                : 'en';

          const t = I18N[language] || I18N.en;
          const locale = language === 'de' ? 'de-AT' : 'en-US';

          /*
           * ========================================================
           * DISPLAY / PERFORMANCE PROFILE
           * ========================================================
           */

          const configuredDisplayMode =
            String(CONFIG.displayMode || 'auto').toLowerCase();

          const configuredPerformanceMode =
            String(CONFIG.performanceMode || 'auto').toLowerCase();

          const viewportWidth = Number(window?.innerWidth || 0);
          const touchPoints = Number(window?.navigator?.maxTouchPoints || 0);
          const userAgent = String(window?.navigator?.userAgent || '');

          const isTouchDevice = touchPoints > 0;
          const isTabletLike = isTouchDevice && viewportWidth >= 700;

          const validDisplayModes = ['auto', 'desktop', 'tablet', 'wall'];
          let displayMode = validDisplayModes.includes(configuredDisplayMode)
            ? configuredDisplayMode
            : 'auto';

          if (displayMode === 'auto') {
            if (isTabletLike) {
              displayMode = 'tablet';
            } else if (viewportWidth >= 1000) {
              displayMode = 'desktop';
            } else {
              displayMode = 'auto';
            }
          }

          const iosVersionMatch = userAgent.match(/OS (\d+)[_.]/i);
          const iosMajorVersion = iosVersionMatch
            ? Number.parseInt(iosVersionMatch[1], 10)
            : null;

          const isOldIOS =
            Number.isFinite(iosMajorVersion) && iosMajorVersion <= 15;

          const supportsColorMix = Boolean(
            window?.CSS?.supports?.(
              'color',
              'color-mix(in srgb, red 50%, blue)'
            )
          );

          const validPerformanceModes = ['auto', 'high', 'balanced', 'low'];
          let performanceMode = validPerformanceModes.includes(configuredPerformanceMode)
            ? configuredPerformanceMode
            : 'auto';

          if (performanceMode === 'auto') {
            if (isOldIOS || !supportsColorMix) {
              performanceMode = 'low';
            } else if (isTabletLike) {
              performanceMode = 'balanced';
            } else {
              performanceMode = 'high';
            }
          }

          /*
           * ========================================================
           * HELPER FUNCTIONS / HILFSFUNKTIONEN
           * ========================================================
           */

          function getSensor(entityId) {
            return states[entityId];
          }

          function getNumber(entityId, fallback = 0) {
            const sensor = getSensor(entityId);
            const value = Number.parseFloat(sensor?.state);

            return Number.isFinite(value) ? value : fallback;
          }

          function getPower(entityId) {
            const sensor = getSensor(entityId);
            let value = Number.parseFloat(sensor?.state);

            if (!Number.isFinite(value)) {
              return 0;
            }

            const unit =
              sensor?.attributes?.unit_of_measurement || '';

            if (unit === 'W') {
              value = value / 1000;
            }

            return value;
          }

          function getEnergy(entityId) {
            const sensor = getSensor(entityId);
            let value = Number.parseFloat(sensor?.state);

            if (!Number.isFinite(value)) {
              return 0;
            }

            const unit =
              sensor?.attributes?.unit_of_measurement || '';

            if (unit === 'Wh') {
              value = value / 1000;
            }

            return value;
          }

          function formatNumber(
            value,
            minimumFractionDigits = 2,
            maximumFractionDigits = 2
          ) {
            return value.toLocaleString(locale, {
              minimumFractionDigits,
              maximumFractionDigits
            });
          }

          function formatPower(value) {
            return formatNumber(value, 3, 3);
          }

          function formatEnergy(value) {
            return formatNumber(value, 2, 2);
          }

          function createGauge(
            value,
            maximum,
            gradientId,
            glowId,
            color
          ) {
            const percentage =
              Math.min(Math.max(value / maximum, 0), 1);

            const pathLength = 100;
            const visibleLength = percentage * pathLength;
            const remainingLength = pathLength - visibleLength;

            const angle =
              Math.PI - percentage * Math.PI;

            const dotX =
              100 + 80 * Math.cos(angle);

            const dotY =
              100 - 80 * Math.sin(angle);

            return `
              <svg
                viewBox="0 0 200 108"
                class="gauge-svg"
              >
                <defs>

                  <linearGradient
                    id="${gradientId}"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%"
                  >
                    <stop
                      offset="0%"
                      stop-color="${color.start}"
                    />

                    <stop
                      offset="100%"
                      stop-color="${color.end}"
                    />
                  </linearGradient>

                  <filter id="${glowId}">

                    <feGaussianBlur
                      stdDeviation="3"
                      result="blur"
                    />

                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>

                  </filter>

                </defs>

                <path
                  d="M 20 100 A 80 80 0 0 1 180 100"
                  pathLength="100"
                  fill="none"
                  stroke="var(--solar-gauge-track)"
                  stroke-width="13"
                  stroke-linecap="round"
                />

                <path
                  d="M 20 100 A 80 80 0 0 1 180 100"
                  pathLength="100"
                  fill="none"
                  stroke="url(#${gradientId})"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-dasharray="
                    ${visibleLength}
                    ${remainingLength}
                  "
                  filter="url(#${glowId})"
                />

                <circle
                  cx="${dotX}"
                  cy="${dotY}"
                  r="7"
                  fill="${color.start}"
                  filter="url(#${glowId})"
                />

              </svg>
            `;
          }

          function formatRuntimeSensor(runtimeSensor, unknownLabel) {
            const raw = runtimeSensor?.state;

            if (!raw || raw === 'unknown' || raw === 'unavailable') {
              return unknownLabel;
            }

            const unit = String(
              runtimeSensor?.attributes?.unit_of_measurement || ''
            ).trim();

            const numeric = Number.parseFloat(raw);

            if (Number.isFinite(numeric)) {
              // If Home Assistant exposes a unit, keep it. Otherwise runtime defaults to hours.
              // Wenn Home Assistant eine Einheit liefert, wird sie verwendet. Sonst gilt Stunde als Standard.
              const runtimeUnit = unit || 'h';
              return `${numeric.toLocaleString(locale, {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
              })} ${runtimeUnit}`;
            }

            return unit ? `${raw} ${unit}` : raw;
          }

          /*
           * ========================================================
           * CURRENT POWER / AKTUELLE LEISTUNGEN
           * ========================================================
           */

          const pvPower = getPower(
            CONFIG.entities.pvPowerTotal
          );

          const housePower = getPower(
            CONFIG.entities.housePower
          );

          const gridExportPower = getPower(
            CONFIG.entities.gridExportPower
          );

          const gridImportPower = getPower(
            CONFIG.entities.gridImportPower
          );

          const batteryPower = getPower(
            CONFIG.entities.batteryPower
          );

          /*
           * ========================================================
           * DAILY ENERGY / TAGESENERGIEN
           * ========================================================
           */

          const solarToday = getEnergy(
            CONFIG.entities.pvEnergyToday
          );

          const exportToday = getEnergy(
            CONFIG.entities.gridExportEnergyToday
          );

          const importToday = getEnergy(
            CONFIG.entities.gridImportEnergyToday
          );

          const batteryInputToday = getEnergy(
            CONFIG.entities.batteryChargeEnergyToday
          );

          const batteryOutputToday = getEnergy(
            CONFIG.entities.batteryDischargeEnergyToday
          );

          /*
           * Hausverbrauch aus Energiebilanz:
           *
           * PV
           * + Netzimport
           * + Batterieentladung
           * - Netzeinspeisung
           * - Batterieladung
           */

          const calculatedHouseToday = Math.max(
            0,
            solarToday +
            importToday +
            batteryOutputToday -
            exportToday -
            batteryInputToday
          );

          const houseToday =
            CONFIG.entities.houseEnergyToday
              ? getEnergy(CONFIG.entities.houseEnergyToday)
              : calculatedHouseToday;

          /*
           * ========================================================
           * BATTERY VALUES / BATTERIEWERTE
           * ========================================================
           */

          const batterySoc = getNumber(
            CONFIG.entities.batterySoc
          );

          const remainingBatteryEnergy = getEnergy(
            CONFIG.entities.batteryEnergyRemaining
          );

          const normalizedSoc =
            Math.min(Math.max(batterySoc, 0), 100);

          let batteryStatus = t.standby;
          let batteryColor = '#90a4ae';
          let batteryIcon = 'mdi:battery';

          if (batteryPower > 0.05) {
            batteryStatus = t.charging;
            batteryColor = '#76ff7a';
            batteryIcon = 'mdi:battery-charging';
          } else if (batteryPower < -0.05) {
            batteryStatus = t.discharging;
            batteryColor = '#ffb43b';
            batteryIcon = 'mdi:battery-arrow-down';
          }

          if (batterySoc <= 20) {
            batteryColor = '#ff5252';
          }

          /*
           * ========================================================
           * GRID STATUS / NETZSTATUS
           * ========================================================
           */

          let gridTitle = 'NETZ';
          let gridCurrentPower = 0;
          let gridIcon = 'mdi:transmission-tower';

          if (gridExportPower > 0.001) {
            gridTitle = 'EINSPEISUNG';
            gridCurrentPower = gridExportPower;
            gridIcon = 'mdi:transmission-tower-export';
          } else if (gridImportPower > 0.001) {
            gridTitle = 'NETZBEZUG';
            gridCurrentPower = gridImportPower;
            gridIcon = 'mdi:transmission-tower-import';
          }

          /*
           * ========================================================
           * ADDITIONAL VALUES / WEITERE WERTE
           * ========================================================
           */

          const compensation = getNumber(
            CONFIG.entities.compensationToday
          );

          const runtimeSensor = getSensor(
            CONFIG.entities.batteryRuntime
          );

          const runtime = formatRuntimeSensor(
            runtimeSensor,
            t.unknown
          );

          /*
           * ========================================================
           * MPPT / TRACKER – DYNAMISCH
           * ========================================================
           */

          const trackers = CONFIG.trackers
            .filter((tracker) =>
              tracker &&
              tracker.enabled !== false &&
              tracker.power &&
              Number(tracker.maxKw) > 0
            )
            .map((tracker, index) => {

              const power = getPower(tracker.power);
              const energyToday =
                tracker.energyToday
                  ? getEnergy(tracker.energyToday)
                  : 0;

              const colorStart =
                tracker.colorStart || '#ff9800';

              const colorEnd =
                tracker.colorEnd || colorStart;

              const name =
                tracker.name || `MPPT ${index + 1}`;

              const maxKw =
                Number(tracker.maxKw) || 1;

              const gauge = createGauge(
                power,
                maxKw,
                `mppt-gradient-${index}`,
                `mppt-glow-${index}`,
                {
                  start: colorStart,
                  end: colorEnd
                }
              );

              return {
                ...tracker,
                index,
                name,
                maxKw,
                power,
                energyToday,
                colorStart,
                colorEnd,
                gauge
              };
            });

          const pvMaximum = trackers.reduce(
            (sum, tracker) => sum + tracker.maxKw,
            0
          );

          const pvPercentRaw =
            pvMaximum > 0
              ? (pvPower / pvMaximum) * 100
              : 0;

          const pvPercentBar =
            Math.min(Math.max(pvPercentRaw, 0), 100);

          const mpptTotalPower = trackers.reduce(
            (sum, tracker) =>
              sum + Math.max(tracker.power, 0),
            0
          );

          const pvScale =
            mpptTotalPower > pvMaximum &&
            mpptTotalPower > 0
              ? pvMaximum / mpptTotalPower
              : 1;

          const trackerBarData = trackers.map(
            (tracker) => ({
              ...tracker,
              barWidth:
                pvMaximum > 0
                  ? Math.min(
                      Math.max(
                        (
                          (
                            tracker.power *
                            pvScale
                          ) /
                          pvMaximum
                        ) * 100,
                        0
                      ),
                      100
                    )
                  : 0
            })
          );

          const mpptCardsHtml = trackers
            .map((tracker) => `
              <div
                class="panel mppt-panel"
                style="
                  --tracker-start:${tracker.colorStart};
                  --tracker-end:${tracker.colorEnd};
                "
              >

                <div class="mppt-title">
                  ${tracker.name}
                </div>

                <div class="mppt-gauge">

                  ${tracker.gauge}

                  <div class="mppt-current-value">
                    ${formatPower(tracker.power)}
                    <span>kW</span>
                  </div>

                </div>

                <div class="mppt-daily-box">

                  <ha-icon
                    icon="mdi:lightning-bolt"
                  ></ha-icon>

                  <div>

                    <div class="mppt-daily-value">
                      ${formatEnergy(tracker.energyToday)}
                      kWh
                    </div>

                    <div class="small-label">
                      ${t.todayUpper} · ${t.maxUpper} ${formatNumber(
                        tracker.maxKw,
                        2,
                        2
                      )} kW
                    </div>

                  </div>

                </div>

              </div>
            `)
            .join('');

          const pvSegmentsHtml = trackerBarData
            .map((tracker) => `
              <div
                class="pv-segment"
                title="${tracker.name}"
                style="
                  width:${tracker.barWidth}%;
                  background:
                    linear-gradient(
                      90deg,
                      ${tracker.colorStart},
                      ${tracker.colorEnd}
                    );
                  box-shadow:
                    0 0 9px ${tracker.colorStart}88;
                "
              ></div>
            `)
            .join('');

          const trackerFooterHtml = trackers
            .map((tracker) => `
              <span
                style="--tracker-start:${tracker.colorStart}; --tracker-end:${tracker.colorEnd};"
              >
                ${tracker.name.replace('MPPT ', '')}
                ${formatPower(tracker.power)}
              </span>
            `)
            .join('');

          const batteryMaximum = CONFIG.limits.batteryCapacityKwh;

          const batteryEnergyPercentRaw =
            batteryMaximum > 0
              ? (remainingBatteryEnergy / batteryMaximum) * 100
              : 0;

          const batteryBarPercent =
            Math.min(
              Math.max(batteryEnergyPercentRaw, 0),
              100
            );

          /*
           * ========================================================
           * MODULE VISIBILITY / ORDER
           * MODUL-SICHTBARKEIT / REIHENFOLGE
           * ========================================================
           */

          const availableModules = [
            'mppt',
            'pvTotal',
            'battery',
            'live',
            'payment',
            'runtime'
          ];

          const configuredModules = Array.from(
            new Set(
              (Array.isArray(CONFIG.modules)
                ? CONFIG.modules
                : availableModules
              ).filter((moduleId) => availableModules.includes(moduleId))
            )
          );

          const moduleEnabled = (moduleId) =>
            configuredModules.includes(moduleId);

          const moduleOrder = (moduleId) => {
            const index = configuredModules.indexOf(moduleId);
            return index >= 0 ? index : 999;
          };

          const moduleClass = (moduleId) =>
            moduleEnabled(moduleId) ? '' : ' module-hidden';

          /*
           * ========================================================
           * OUTPUT / AUSGABE
           * ========================================================
           */

          return `
            <div class="solar-dashboard modules-custom display-${displayMode} perf-${performanceMode}">

              <!-- =============================================== -->
              <!-- MPPT / TRACKER – DYNAMISCH -->
              <!-- =============================================== -->

              <div
                class="mppt-grid module-item module-mppt${moduleClass('mppt')}"
                style="--mppt-count:${Math.max(trackers.length, 1)}; --module-order:${moduleOrder('mppt')};"
              >
                ${mpptCardsHtml}
              </div>

              <!-- =============================================== -->
              <!-- LIVE ENERGY FLOW / LIVE-ENERGIEFLUSS -->
              <!-- =============================================== -->

              <div class="panel live-panel module-item module-live${moduleClass('live')}" style="--module-order:${moduleOrder('live')};">

                <div class="live-grid">

                  <!-- PV -->

                  <div class="live-item live-pv">

                    <ha-icon
                      icon="mdi:solar-power"
                    ></ha-icon>

                    <div class="live-title">
                      ${t.pv}
                    </div>

                    <div class="live-current">
                      ${formatPower(pvPower)}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">
                      <span>
                        ${t.today} ${formatEnergy(solarToday)} kWh
                      </span>
                      <span>
                        ${t.max} ${formatNumber(pvMaximum, 2, 2)} kW
                      </span>
                    </div>

                  </div>

                  <!-- HAUS -->

                  <div class="live-item live-house">

                    <ha-icon
                      icon="mdi:home-lightning-bolt"
                    ></ha-icon>

                    <div class="live-title">
                      ${t.house}
                    </div>

                    <div class="live-current">
                      ${formatPower(housePower)}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">
                      <span>
                        ${t.today} ${formatEnergy(houseToday)} kWh
                      </span>
                      <span>
                        ${t.current} ${formatPower(housePower)} kW
                      </span>
                    </div>

                  </div>

                  <!-- NETZ -->

                  <div class="live-item live-grid-value">

                    <ha-icon
                      icon="${gridIcon}"
                    ></ha-icon>

                    <div class="live-title">
                      ${t.grid}
                    </div>

                    <div class="live-current">
                      ${formatPower(
                        Math.abs(gridCurrentPower)
                      )}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">

                      <span>
                        ${t.import}
                        ${formatEnergy(importToday)}
                        kWh
                      </span>

                      <span>
                        ${t.export}
                        ${formatEnergy(exportToday)}
                        kWh
                      </span>

                    </div>

                  </div>

                  <!-- BATTERIE -->

                  <div class="live-item live-battery">

                    <ha-icon
                      icon="${batteryIcon}"
                    ></ha-icon>

                    <div class="live-title">
                      ${t.battery}
                    </div>

                    <div class="live-current">
                      ${formatPower(
                        Math.abs(batteryPower)
                      )}
                      <span>kW</span>
                    </div>

                    <div class="live-double-value">

                      <span>
                        ${t.charge}
                        ${formatEnergy(batteryInputToday)}
                        kWh
                      </span>

                      <span>
                        ${t.discharge}
                        ${formatEnergy(batteryOutputToday)}
                        kWh
                      </span>

                    </div>

                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- PV TOTAL – V5 QUERBALKEN -->
              <!-- =============================================== -->

              <div class="panel pv-total-panel v5-bar-panel module-item module-pv-total${moduleClass('pvTotal')}" style="--module-order:${moduleOrder('pvTotal')};">

                <div class="v5-bar-header centered-header">

                  <div class="v5-bar-title">
                    ${t.pvTotal}
                  </div>

                  <div class="v5-bar-main">
                    ${formatPower(pvPower)}
                    <span>kW</span>
                  </div>

                </div>

                <div class="pv-split-track">
                  ${pvSegmentsHtml}
                </div>

                <div class="v7-pv-footer">

                  <div class="tracker-footer-values">
                    ${trackerFooterHtml}
                  </div>

                  <div class="pv-percent">
                    ${formatNumber(
                      pvPercentRaw,
                      0,
                      0
                    )} %
                    ·
                    ${formatEnergy(solarToday)} kWh ${t.today.toLowerCase()}
                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- BATTERIE – V5 QUERBALKEN -->
              <!-- =============================================== -->

              <div class="panel battery-panel v5-bar-panel module-item module-battery${moduleClass('battery')}" style="--module-order:${moduleOrder('battery')};">

                <div class="v5-bar-header centered-header">

                  <div class="v5-bar-title">
                    ${t.battery}
                  </div>

                  <div class="v5-bar-main">
                    ${formatNumber(
                      batterySoc,
                      0,
                      0
                    )}
                    <span>%</span>
                  </div>

                </div>

                <div class="battery-horizontal-track">

                  <div
                    class="battery-horizontal-fill"
                    style="
                      width:${batteryBarPercent}%;
                      background:${batteryColor};
                      box-shadow:0 0 10px ${batteryColor};
                    "
                  ></div>

                </div>

                <div class="v5-bar-footer">

                  <span>
                    ${formatEnergy(remainingBatteryEnergy)}
                    / ${formatNumber(CONFIG.limits.batteryCapacityKwh, 2, 2)} kWh
                  </span>

                  <span
                    class="v5-footer-center"
                    style="color:${batteryColor};"
                  >
                    ${batteryStatus}
                  </span>

                  <span>
                    ${formatPower(
                      Math.abs(batteryPower)
                    )} kW
                  </span>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- VERGÜTUNG -->
              <!-- =============================================== -->

              <div class="panel information-panel payment-panel module-item module-payment${moduleClass('payment')}" style="--module-order:${moduleOrder('payment')};">

                <ha-icon
                  icon="mdi:transmission-tower-export"
                ></ha-icon>

                <div class="information-content">

                  <div class="information-title">
                    ${t.compensationToday}
                  </div>

                  <div class="information-value">
                    ${formatNumber(
                      compensation,
                      2,
                      2
                    )} €
                  </div>

                  <div class="information-subtitle">
                    ${t.feedInRevenue}
                  </div>

                </div>

              </div>

              <!-- =============================================== -->
              <!-- RESTLAUFZEIT -->
              <!-- =============================================== -->

              <div class="panel information-panel runtime-panel module-item module-runtime${moduleClass('runtime')}" style="--module-order:${moduleOrder('runtime')};">

                <ha-icon
                  icon="mdi:battery-clock-outline"
                ></ha-icon>

                <div class="information-content">

                  <div class="information-title">
                    ${t.runtime}
                  </div>

                  <div class="information-value">
                    ${runtime}
                  </div>

                  <div class="information-subtitle">
                    ${t.battery}
                  </div>

                </div>

              </div>

            </div>
          `;
        ]]]
    styles:
      card:
        - padding: 0
        - border: none
        - box-shadow: none
        - background: transparent
        - overflow: visible
      grid:
        - grid-template-areas: '"dashboard"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        dashboard:
          - width: 100%
          - overflow: visible
    extra_styles: |
      /*
       * ==========================================================
       * v0.8.3-alpha MODULE ORDER / MODULE REIHENFOLGE
       * ==========================================================
       */

      .solar-dashboard.modules-custom {
        grid-template-areas: none !important;
        grid-auto-flow: row dense;
      }

      .solar-dashboard.modules-custom > .module-item {
        grid-area: auto !important;
        order: var(--module-order, 0);
      }

      .solar-dashboard.modules-custom > .module-mppt,
      .solar-dashboard.modules-custom > .module-live {
        grid-column: 1 / -1 !important;
      }

      .solar-dashboard.modules-custom > .module-pv-total,
      .solar-dashboard.modules-custom > .module-battery,
      .solar-dashboard.modules-custom > .module-payment,
      .solar-dashboard.modules-custom > .module-runtime {
        grid-column: span 1 !important;
      }

      .solar-dashboard.modules-custom > .module-hidden {
        display: none !important;
      }

      @media screen and (max-width: 699px) {
        .solar-dashboard.modules-custom > .module-pv-total,
        .solar-dashboard.modules-custom > .module-battery,
        .solar-dashboard.modules-custom > .module-payment,
        .solar-dashboard.modules-custom > .module-runtime {
          grid-column: 1 / -1 !important;
        }
      }

      /*
       * v0.8.2-alpha - display/performance compatibility layer
       * v0.8.2-alpha - Display-/Performance-Kompatibilität
       */

      .solar-dashboard.perf-balanced .panel {
        box-shadow: 0 5px 16px rgba(0,0,0,0.13);
      }

      .solar-dashboard.perf-balanced .gauge-svg path,
      .solar-dashboard.perf-balanced .gauge-svg circle {
        filter: none;
      }

      /* Old Safari / iPadOS 15 compatibility. / Kompatibilität für Safari/iPadOS 15. */
      .solar-dashboard.perf-low {
        --solar-surface-soft: var(--solar-surface);
        --solar-surface-strong: var(--solar-surface);
        --solar-border: var(--divider-color, rgba(128,128,128,0.25));
        --solar-divider: var(--divider-color, rgba(128,128,128,0.22));
        --solar-gauge-track: rgba(128,128,128,0.22);
        --solar-inset: rgba(128,128,128,0.08);
        --solar-track: rgba(128,128,128,0.13);
        --solar-shadow: 0 3px 10px rgba(0,0,0,0.12);
      }

      .solar-dashboard.perf-low .panel {
        background: var(--solar-surface) !important;
        box-shadow: var(--solar-shadow) !important;
      }

      .solar-dashboard.perf-low .mppt-panel {
        background:
          radial-gradient(circle at 50% 110%, rgba(255,180,40,0.08), transparent 52%),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low .pv-total-panel {
        background:
          radial-gradient(circle at 12% 110%, rgba(255,152,0,0.11), transparent 48%),
          radial-gradient(circle at 88% 110%, rgba(67,160,71,0.10), transparent 48%),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low .battery-panel {
        background:
          radial-gradient(circle at 55% 115%, rgba(76,175,80,0.10), transparent 52%),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low .live-panel {
        background:
          linear-gradient(
            90deg,
            rgba(255,193,7,0.035) 0%,
            rgba(33,150,243,0.035) 34%,
            rgba(38,198,218,0.035) 67%,
            rgba(76,175,80,0.035) 100%
          ),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low .payment-panel {
        background:
          linear-gradient(145deg, rgba(66,165,245,0.08), transparent 65%),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low .runtime-panel {
        background:
          linear-gradient(145deg, rgba(142,92,255,0.08), transparent 65%),
          var(--solar-surface) !important;
      }

      .solar-dashboard.perf-low *,
      .solar-dashboard.perf-low *::before,
      .solar-dashboard.perf-low *::after {
        transition-duration: 0s !important;
        animation-duration: 0s !important;
      }

      .solar-dashboard.perf-low .gauge-svg path,
      .solar-dashboard.perf-low .gauge-svg circle,
      .solar-dashboard.perf-low ha-icon {
        filter: none !important;
      }

      .solar-dashboard.perf-low .pv-segment,
      .solar-dashboard.perf-low .battery-horizontal-fill {
        box-shadow: none !important;
      }

      /* Wall display profile. / Profil für Wand-Displays. */
      @media screen and (min-width: 700px) {
        .solar-dashboard.display-wall {
          gap: 12px !important;
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          grid-template-areas:
            "pv battery"
            "live live"
            "mppt mppt"
            "payment runtime" !important;
        }

        .solar-dashboard.display-wall .mppt-grid {
          grid-template-columns: repeat(var(--mppt-count), minmax(0, 1fr)) !important;
          gap: 10px;
        }

        .solar-dashboard.display-wall .pv-total-panel,
        .solar-dashboard.display-wall .battery-panel {
          height: 112px !important;
        }

        .solar-dashboard.display-wall .live-panel {
          height: 132px !important;
        }

        .solar-dashboard.display-wall .mppt-panel {
          height: 190px !important;
        }

        .solar-dashboard.display-wall .information-panel {
          height: 100px !important;
        }

        .solar-dashboard.display-wall .v5-bar-main {
          font-size: 26px !important;
        }

        .solar-dashboard.display-wall .v5-bar-title {
          font-size: 10px !important;
        }

        .solar-dashboard.display-wall .pv-split-track,
        .solar-dashboard.display-wall .battery-horizontal-track {
          height: 16px !important;
        }

        .solar-dashboard.display-wall .live-item ha-icon {
          width: 31px !important;
          height: 31px !important;
        }

        .solar-dashboard.display-wall .live-title {
          font-size: 9px !important;
        }

        .solar-dashboard.display-wall .live-current {
          font-size: 22px !important;
        }

        .solar-dashboard.display-wall .live-double-value {
          font-size: 9px !important;
          line-height: 1.35 !important;
        }

        .solar-dashboard.display-wall .mppt-title {
          font-size: 17px !important;
        }

        .solar-dashboard.display-wall .mppt-current-value {
          font-size: 28px !important;
        }

        .solar-dashboard.display-wall .mppt-daily-value {
          font-size: 13px !important;
        }

        .solar-dashboard.display-wall .information-title {
          font-size: 11px !important;
        }

        .solar-dashboard.display-wall .information-value {
          font-size: 22px !important;
        }
      }

      /*
       * ==========================================================
       * BASE LAYOUT / GRUNDLAYOUT
       * ==========================================================
       */

      .solar-dashboard {
        --solar-surface: var(--ha-card-background, var(--card-background-color));
        --solar-surface-soft: color-mix(in srgb, var(--solar-surface) 94%, var(--primary-text-color) 6%);
        --solar-surface-strong: color-mix(in srgb, var(--solar-surface) 88%, var(--primary-text-color) 12%);
        --solar-text: var(--primary-text-color);
        --solar-text-secondary: var(--secondary-text-color);
        --solar-border: var(--divider-color, color-mix(in srgb, var(--primary-text-color) 14%, transparent));
        --solar-divider: var(--divider-color, color-mix(in srgb, var(--primary-text-color) 16%, transparent));
        --solar-gauge-track: color-mix(in srgb, var(--primary-text-color) 13%, transparent);
        --solar-inset: color-mix(in srgb, var(--primary-text-color) 5%, transparent);
        --solar-track: color-mix(in srgb, var(--primary-text-color) 8%, transparent);
        --solar-shadow: 0 8px 24px rgba(0,0,0,0.16);

        box-sizing: border-box;
        display: grid;
        width: 100%;
        gap: 10px;
        color: var(--solar-text);

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        grid-template-areas:
          "mppt1 mppt2"
          "pv battery"
          "live live"
          "payment runtime";
      }

      .panel {
        box-sizing: border-box;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--solar-border);
        border-radius: 24px;
        background:
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
        box-shadow: var(--solar-shadow);
      }

      .mppt1-panel {
        grid-area: mppt1;
      }

      .mppt2-panel {
        grid-area: mppt2;
      }

      .live-panel {
        grid-area: live;
      }

      .pv-total-panel {
        grid-area: pv;
      }

      .battery-panel {
        grid-area: battery;
      }

      .payment-panel {
        grid-area: payment;
      }

      .runtime-panel {
        grid-area: runtime;
      }

      /*
       * ==========================================================
       * MPPT
       * ==========================================================
       */

      .mppt-panel {
        display: flex;
        flex-direction: column;
        height: 225px;
        padding: 15px 14px 13px 14px;
      }

      .mppt-title {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
      }

      .mppt-gauge {
        position: relative;
        height: 112px;
        margin-top: 3px;
      }

      .gauge-svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .mppt-current-value {
        position: absolute;
        right: 0;
        bottom: 5px;
        left: 0;
        text-align: center;
        font-size: 29px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .mppt-current-value span {
        font-size: 13px;
        opacity: 0.70;
      }

      .mppt-daily-box {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 82%;
        min-height: 48px;
        margin: auto auto 0 auto;
        padding: 7px 8px;
        border: 1px solid var(--solar-border);
        border-radius: 16px;
        background: var(--solar-inset);
        text-align: center;
      }

      .mppt1-panel .mppt-daily-box ha-icon {
        color: #ffd740;
      }

      .mppt2-panel .mppt-daily-box ha-icon {
        color: #76ff7a;
      }

      .mppt-daily-box ha-icon {
        width: 25px;
        height: 25px;
      }

      .mppt-daily-value {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * ==========================================================
       * LIVE ENERGY FLOW / LIVE-ENERGIEFLUSS
       * ==========================================================
       */

      .live-panel {
        height: 155px;
      }

      .live-grid {
        box-sizing: border-box;
        display: grid;
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
        width: 100%;
        height: 100%;
        padding: 12px 5px;
      }

      .live-item {
        box-sizing: border-box;
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        border-right:
          1px solid var(--solar-divider);
        text-align: center;
      }

      .live-item:last-child {
        border-right: none;
      }

      .live-item ha-icon {
        width: 25px;
        height: 25px;
        margin-bottom: 5px;
      }

      .live-title {
        width: 100%;
        overflow: hidden;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
