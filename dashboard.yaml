        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * ==========================================================
       * BATTERIE
       * ==========================================================
       */

      .battery-panel {
        display: grid;
        grid-template-columns: 68px 1fr auto;
        align-items: center;
        height: 165px;
        padding: 18px 24px;

        background:
          radial-gradient(
            circle at 5% 50%,
            rgba(118,255,122,0.12),
            transparent 36%
          ),
          linear-gradient(
            145deg,
            var(--solar-surface-soft),
            var(--solar-surface)
          );
      }

      .battery-symbol {
        position: relative;
        width: 43px;
        height: 82px;
      }

      .battery-tip {
        position: absolute;
        top: -5px;
        left: 13px;
        width: 17px;
        height: 6px;
        border-radius: 3px 3px 0 0;
        background: color-mix(in srgb, var(--solar-text) 68%, transparent);
      }

      .battery-body {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 3px solid color-mix(in srgb, var(--solar-text) 68%, transparent);
        border-radius: 8px;
        background: var(--solar-inset);
      }

      .battery-fill {
        position: absolute;
        right: 4px;
        bottom: 4px;
        left: 4px;
        min-height: 3px;
        border-radius: 4px;
        transition: height 0.7s ease;
      }

