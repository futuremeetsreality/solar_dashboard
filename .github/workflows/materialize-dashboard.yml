name: Build dashboard.yaml

on:
  push:
    paths:
      - 'src/**'
      - 'tools/build_dashboard.py'
      - 'tools/apply_modules_v0_8_3.py'
      - 'tools/dashboard_v7.yaml.gz.b64'
      - 'tools/apply_theme_v7_1.py'
      - 'tools/apply_v72_theme.py'
      - 'tools/apply_i18n_v0_8.py'
      - 'tools/apply_display_v0_8_1.py'
      - '.github/workflows/materialize-dashboard.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build modular dashboard
        shell: bash
        run: |
          python tools/build_dashboard.py

      - name: Commit generated dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.yaml
          if git diff --cached --quiet; then
            echo "dashboard.yaml is already up to date"
            exit 0
          fi
          git commit -m "Generate dashboard.yaml v0.8.5-alpha"
          git push
