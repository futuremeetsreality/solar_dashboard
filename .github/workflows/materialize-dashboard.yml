name: Build dashboard.yaml

on:
  push:
    paths:
      - 'tools/dashboard_v7.yaml.gz.b64'
      - 'tools/apply_theme_v7_1.py'
      - '.github/workflows/materialize-dashboard.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode V7 dashboard
        shell: bash
        run: |
          base64 -d tools/dashboard_v7.yaml.gz.b64 | gunzip > dashboard.yaml

      - name: Apply V7.1 Home Assistant theme support
        shell: bash
        run: |
          python tools/apply_theme_v7_1.py

      - name: Commit generated dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.yaml
          if git diff --cached --quiet; then
            echo "dashboard.yaml is already up to date"
            exit 0
          fi
          git commit -m "Generate dashboard.yaml V7.1 with light/dark support"
          git push